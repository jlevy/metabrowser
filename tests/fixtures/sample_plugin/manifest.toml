[plugin]
name = "sample"
display_name = "Sample (test fixture)"
version = "0.0.1"
sdk_version = "0.1"

# A pure-JS plugin — no Python sidekick. Detection is declarative
# (extension + frontmatter key); rendering is fully client-side.
[[kind]]
id = "sample-doc"
match = { ext = ".md", frontmatter_has_key = "sample" }
priority = 200

[[view]]
kind = "sample-doc"
id = "card"
label = "Card"
default = true

[[view]]
kind = "sample-doc"
id = "raw"
label = "Source"
