[plugin]
name = "sidekick-sample"
display_name = "Sample with sidekick (test fixture)"
version = "0.0.1"
sdk_version = "0.1"

[[kind]]
id = "sidekick-doc"
match = { ext = ".md", frontmatter_has_key = "sidekick_sample" }
priority = 200

[[view]]
kind = "sidekick-doc"
id = "summary"
label = "Summary"
default = true

# Python sidekick — registers a /api/plugin/sidekick-sample/echo handler
# that returns the message it was asked to echo plus the path it received.
[[data_hook]]
route = "echo"
sidekick = "sidekick_sample.handlers:echo_handler"
methods = ["GET"]

[[data_hook]]
route = "explode"
sidekick = "sidekick_sample.handlers:explode_handler"
methods = ["GET"]

[[data_hook]]
route = "explicit-500"
sidekick = "sidekick_sample.handlers:explicit_500_handler"
methods = ["GET"]
