schema = "web-performance-budgets/v1"

# Scope: this file gates repository-shaped corpora -- a tree with the directory
# fan-out real checkouts have, which is what project-10 reproduces and what every
# release gate here is calibrated from. It is passed to `run.py` via `--budgets`,
# and a corpus with a deliberately different shape is measured against its own file
# rather than this one, because a budget carried to a shape it was not derived from
# reports a number nobody calibrated. `performance-budgets-flat-stress.toml` is the
# flat mega-tree companion and explains what it ratchets and why it is weaker.

[requirements]
profile_schema = "web-performance-profile/v1"
responsiveness_source = "navigation-profiler"
vitals_source = "navigation-profiler"
require_visible = true
require_interactions = true
minimum_interaction_inputs = 5
minimum_interaction_coverage_pct = 80
require_no_label_overflow = true
require_no_fetch_concurrency_overflow = true
require_no_resource_overflow = true
required_observers = ["longtask", "event"]
# `dirty` is not listed: an attested external wheel records it as null because its
# source tree cannot be verified. `run.py compare` requires it for every other build.
required_fields = [
  "commit",
  "corpus",
  "files",
  "harness_version",
  "recorded_at",
  "viewport_h",
  "viewport_w",
]
minimum_runs_per_condition = 3
completion_field = "index_status_at_probe"
completion_values = ["done", "truncated"]

# Hard gates defend properties the current application satisfies. A candidate
# exceeding one cannot be accepted even when its primary metric improves.
[metrics.long_task_max_ms]
category = "responsiveness"
maximum = 200
policy = "gate"
required = true
description = "Longest task from navigation through settle."

[metrics.long_task_max_ms_first_5s]
category = "responsiveness"
maximum = 200
policy = "gate"
required = true
description = "Longest task while the reader is deciding whether the page is alive."

[metrics.long_tasks_over_200ms]
category = "responsiveness"
maximum = 0
policy = "gate"
required = true
description = "No synchronous task may cross the responsiveness budget."

[metrics.animation_frame_max_ms]
category = "responsiveness"
maximum = 200
policy = "target"
required = false
description = "Longest Chromium animation frame, including non-blocking navigation gaps."

[metrics.animation_frames_over_200ms]
category = "responsiveness"
maximum = 0
policy = "target"
required = false
description = "Animation frames crossing 200 ms, including non-blocking navigation gaps."

[metrics.animation_frame_blocking_ms_max]
category = "responsiveness"
maximum = 200
policy = "gate"
required = false
description = "Worst main-thread blocking attributed by Chromium Long Animation Frame."

[metrics.animation_frames_blocking_over_200ms]
category = "responsiveness"
maximum = 0
policy = "gate"
required = false
description = "Animation frames whose attributed blocking crosses the responsiveness budget."

[metrics.interaction_max_ms]
category = "responsiveness"
maximum = 200
policy = "gate"
required = true
description = "Worst captured interaction-to-next-paint latency."

[metrics.main_thread_blocked_pct]
category = "responsiveness"
maximum = 5
policy = "gate"
required = true
description = "Whole-window blocked share catches sustained smaller hitches."

[metrics.inventory_delivery_max_ms]
category = "responsiveness"
maximum = 50
policy = "gate"
required = true
description = "No inventory or catalog delivery callback may become a Long Task."

[metrics.inventory_delivery_attribution_missing]
category = "responsiveness"
maximum = 0
policy = "gate"
required = true
description = "The application must retain named inventory-delivery attribution."

[metrics.inventory_delivery_work_pct]
category = "responsiveness"
maximum = 5
policy = "gate"
required = true
description = "Inventory delivery may not consume a sustained share of the measured main-thread window."

[metrics.fetch_network_errors]
category = "correctness"
maximum = 0
policy = "gate"
required = true
description = "Rejected non-abort fetches, which status and timing summaries otherwise hide."

[metrics.fetches_in_flight]
category = "correctness"
maximum = 0
policy = "gate"
required = true
description = "A settled browser profile may not leave application fetch work running."

[metrics.fetch_http_5xx]
category = "correctness"
maximum = 0
policy = "gate"
required = true
description = "Server failures observed by the page."

[metrics.rendered_preview_errors]
category = "correctness"
maximum = 0
policy = "gate"
required = true
description = "Rendered main-panel error states are failed product behavior, not valid paint milestones."

[metrics.page_exceptions]
category = "correctness"
maximum = 0
policy = "gate"
required = true
description = "Uncaught browser exceptions observed from navigation through settled profile export."

[metrics.collapsed_diff_rows_materialized]
category = "rendering"
maximum = 0
policy = "gate"
required = true
description = "Rows hidden by a collapsed diff fold must not occupy the DOM."

# Targets stay visible on every comparison but do not block unrelated work
# until the application reaches them. Once reached, promote the policy to gate.
[metrics.fetch_aborts]
category = "correctness"
maximum = 0
policy = "target"
required = true
description = "Aborted requests stay visible until each scenario declares cancellation intentional."

[metrics.fetch_http_4xx]
category = "correctness"
maximum = 0
policy = "target"
required = true
description = "Client-visible missing or rejected resources."

[metrics.fcp_ms]
category = "loading"
maximum = 200
policy = "target"
required = false
description = "First contentful paint."

[metrics.lcp_ms]
category = "loading"
maximum = 2500
policy = "target"
required = false
description = "Largest contentful paint."

# exp-014 measured 74 startup scripts before selected-kind loading, 33 after that
# change, and 22 after shell tools moved behind the first usable tree on the same
# 111,590-file corpus. The request ceiling retains headroom for a small core module.
# It and the byte ceiling below bound what the startup scripts cost, and their headrooms
# add: at 27ea216c, five shell tools made startup scripts, about 45 KB, fit both.
# Neither decides which scripts may be startup scripts. tests/test_check_startup_scripts.py
# holds every on-demand bundle, shell-tools among them, out of the startup set.
# devtools/check_startup_scripts.py applies these two on every `make lint-check`,
# from the shell the server renders; exp-037 is why, and records it agreeing with
# the browser's count byte for byte.
[metrics.startup_script_requests]
category = "loading"
maximum = 25
policy = "gate"
required = true
description = "JavaScript requests started before DOMContentLoaded, excluding the separately reported vendor-prefetch tier."

# The size of a build whose cost was measured directly. Main's startup scripts at
# 27ea216c (178,592 bytes, 174 KB) with comment added to 225,531 bytes (220 KB), no
# token changed, were loaded back to back against main, cold, on a folder's page, in
# headless Chrome 152 on 2026-11-12. First row, as the paired median ratio with its 95%
# bootstrap interval:
#   loopback, 30 pairs           1.07x (1.03-1.14), +6.6 ms
#   10 ms, 100 Mbps, 20 pairs    0.99x (0.95-1.11), -0.7 ms
#   80 ms, 20 Mbps, 10 pairs     1.04x (1.03-1.04), +19.4 ms
# That is a rough cut, not the careful 1.1x: the host was loaded (load average 56-92 on
# 10 cores), each path is one series, and there is no A/A series. Read as median pair
# ratios and their intervals, growth to 220 KB is inside the 1.3x rough-cut tolerance,
# with medians under 1.1x and intervals that reach past it. Read pair by pair, as the
# rule in explorations/performance-loop/README.md ("Comparing a candidate with the
# previous release") judges a release, 3 of 30 loopback pairs exceeded 1.3x and none
# fell below 1/1.3, and the rule's rerun was not applied. The samples, and the probe
# command that prints these intervals from them, are experiments/exp-084; the reasoning is
# docs/project/research/research-2026-11-12-eager-startup-script-cost.md. Per-KB slopes
# there chose 220 as the size to measure; they are not its evidence.
# On loopback the cost is the server gzipping each script as it sends it: the same
# scripts sent uncompressed reached the first row 32 ms sooner. Parse runs on a worker
# while a script streams in, at 0.01 ms/KB on the main thread. Warm loads and a 4x
# slower CPU showed no measurable cost of bytes. Comments are 41% of these bytes and
# cost what code bytes cost. This headroom adds to the request ceiling's (above), and
# neither decides which scripts are startup scripts. Re-derive the ceiling rather than
# raise it: it is measured from 174 KB, and a server that stops compressing on every
# request changes the loopback cost.
[metrics.startup_script_transfer_kb]
category = "loading"
maximum = 220
policy = "gate"
required = true
description = "Transferred startup JavaScript before DOMContentLoaded, excluding the separately reported vendor-prefetch tier."

# The exact 300,000-file cold trace measured ordinary shell CSS server work at
# 20.9 ms and an unprepared first KPress stylesheet request at 196.6 ms. This
# ceiling leaves more than three times the healthy observation while rejecting
# the deferred-import cost that held first paint.
[metrics.startup_style_server_ms_max]
category = "loading"
maximum = 75
policy = "gate"
required = true
description = "Maximum server work for a render-blocking stylesheet requested before DOMContentLoaded."

[metrics.shell_tools_missing]
category = "correctness"
maximum = 0
policy = "gate"
required = true
description = "Deferred application-lifetime search, keyboard, Help, and Git controls did not reach ready state."

[metrics.file_catalog_incomplete]
category = "correctness"
maximum = 0
policy = "gate"
required = true
description = "Quick File did not converge to an authoritative complete catalog after the index settled."

# exp-035 performed the quiet-machine recalibration the rough-cut value asked for, from
# the runs exp-034 recorded, and it landed on the number already here. Five quiet-host
# candidate runs on the repository-shaped project-10 corpus put the worst first row at
# 317 ms, and the careful 1.1x tolerance on that is 348.7 ms against this gate's 350.
# The value is therefore confirmed rather than changed, and it is a tuned budget now
# rather than a rough cut. It continues to reject the class of regression v0.1.0-v0.9.1
# shipped, where a whole-repository .gitignore pre-walk held first rows for 9-34 s.
[metrics.first_row_ms]
category = "application"
maximum = 350
policy = "gate"
required = true
description = "Metabrowser's first usable navigation row."

[metrics.cls]
category = "visual-stability"
maximum = 0.1
policy = "target"
required = false
description = "Cumulative layout shift without recent input."

[metrics.reserved_region_shift_px]
category = "application"
maximum = 0
policy = "target"
required = true
description = "Movement in the two explicitly reserved Metabrowser regions."

[metrics.tree_region_repaints]
category = "application"
maximum = 1
policy = "target"
required = true
description = "Whole tree-region replacements from navigation through settle."

[metrics.frame_missing_px]
category = "application"
maximum = 0
policy = "target"
required = true
description = "Settled frame height absent from the shipped shell."

[metrics.dom_nodes]
category = "rendering"
maximum = 20000
policy = "target"
required = true
description = "At-rest DOM size."
