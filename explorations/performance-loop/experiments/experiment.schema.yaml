# Compiled schema for one exploration round. Kept small on purpose: only the
# The ledger reads paired outcomes, diagnostic observations, and chart annotations.
# Detailed reasoning and procedures remain in the artifact and its protocol.
$schema: https://json-schema.org/draft/2020-12/schema
$id: metabrowser.loadtime:Experiment/v1
title: Experiment
type: object
additionalProperties: false
required: [id, title, date, hypotheses, subject, method, verdict]
allOf:
  - if:
      properties:
        verdict:
          additionalProperties: true
          properties:
            decision: {const: diagnostic}
    then:
      required: [observations]
      not:
        required: [results]
    else:
      required: [results]
      properties:
        method:
          additionalProperties: true
          required: [runs_per_condition, control, candidate]
properties:
  id:
    type: string
    pattern: "^exp-[0-9]{3}$"
  title:
    type: string
    minLength: 1
  date:
    type: string
    description: ISO date the measurements were taken.
  hypotheses:
    type: array
    minItems: 1
    description: Hypothesis ids from the plan's registry, e.g. H1.
    items:
      type: string
      pattern: "^H[0-9]+$"
  subject:
    type: object
    additionalProperties: false
    required: [corpus, corpus_files, host_system, browser]
    properties:
      corpus: {type: string, description: How the tree was built, e.g. build_corpus.}
      corpus_files: {type: integer, minimum: 1}
      corpus_dirs: {type: integer, minimum: 1}
      host_cpu: {type: string}
      host_system: {type: string}
      browser: {type: string}
      viewport:
        type: string
        description: Browser viewport the run was measured at, e.g. 1280x900. The tree pages rows against it.
      cold:
        type: boolean
        description: Fresh port (empty HTTP cache) and fresh server (scan running).
      power:
        type: object
        additionalProperties: false
        required: [low_power_mode, source]
        description: >-
          The judged power mode: the pair of Low Power Mode (`pmset -g` lowpowermode) and
          power source, as read before the series' first attempt. The mode decides a
          series' regime, so a pair read in another mode judges nothing. Older records keep
          this in host_system.
        properties:
          low_power_mode: {type: integer, enum: [0, 1]}
          source:
            type: string
            enum: [AC Power, Battery Power]
            description: >-
              The source exactly as `pmset -g batt` names it after "Now drawing from", which
              is what paced-series.sh records in src_start and src_end.
  method:
    type: object
    additionalProperties: false
    dependentRequired:
      analysis: [protocol]
    properties:
      runs_per_condition: {type: integer, minimum: 1}
      interleaved: {type: boolean}
      control: {type: string}
      candidate: {type: string}
      record: {type: string, description: Path to the recorded runs.}
      protocol:
        type: object
        additionalProperties: false
        required: [path, sha256]
        description: >-
          The round's committed protocol (pre-registration, criteria, and amendments): a path
          beside the record, and the sha256 of that file as committed with the record. A
          recorded round's protocol is not edited again; a later correction goes in the
          record. tests/test_experiment_storage.py checks both.
        properties:
          path: {type: string}
          sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      analysis:
        type: array
        minItems: 1
        description: >-
          The exclusion and analysis scripts the protocol registered by sha256, committed
          before the first result was read. Each entry gives a path under experiments/ and
          the sha256 of that file as committed with the record, which must be the hash
          method.protocol's file registers. A script changed after registration says so: it
          gives the protocol's hash as registered_sha256 and the reason as deviation, and the
          record has a heading containing "Deviation" that rules on it.
          tests/test_experiment_storage.py checks all of this.
        items:
          type: object
          additionalProperties: false
          required: [path, sha256]
          dependentRequired:
            registered_sha256: [deviation]
            deviation: [registered_sha256]
          properties:
            path: {type: string}
            sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
            registered_sha256:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: The hash the protocol registered, when the committed file differs.
            deviation:
              type: string
              minLength: 1
              description: Why the committed file differs from the one the protocol registered.
      bytecode:
        type: string
        enum: [cached, uncached]
        description: >-
          For a start-up round, the bytecode state its builds were measured in, as
          startup_pairs.py names it. Most of an uncached start is compiling, so the
          ledger marks a round's figures with this.
  results:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [metric, control_median, candidate_median, overlapping]
      properties:
        metric: {type: string}
        control_median: {type: number}
        candidate_median: {type: number}
        control_range: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
        candidate_range: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
        change_pct: {type: number}
        overlapping:
          type: boolean
          description: Ranges overlap, so this metric is not a result on its own.
  observations:
    type: array
    minItems: 1
    description: Measurements with their actual regime and units. A diagnostic cannot enter the paired results series.
    items:
      type: object
      additionalProperties: false
      required: [phase, scenario, condition, metric, unit, statistic, sample_count, value]
      properties:
        phase:
          type: string
          enum: [startup, navigation_api, browser_navigation, browser_rendering, provider]
        scenario: {type: string, minLength: 1}
        condition: {type: string, minLength: 1}
        metric: {type: string, minLength: 1}
        unit: {type: string, enum: [ms, frames, bytes, requests, processes, points, count, px, ratio]}
        statistic: {type: string, enum: [sample, minimum, median, p95, maximum]}
        sample_count: {type: integer, minimum: 1}
        value: {type: number}
  annotations:
    type: array
    minItems: 1
    description: Short chart labels explaining changes, findings, and comparability limits.
    items:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: {type: string, enum: [change, finding, limitation]}
        text: {type: string, minLength: 1}
  complexity:
    type: object
    additionalProperties: false
    properties:
      lines_changed: {type: integer, minimum: 0}
      new_dependencies: {type: array, items: {type: string}}
      new_failure_modes: {type: array, items: {type: string}}
      notes: {type: string}
  verdict:
    type: object
    additionalProperties: false
    required: [decision, primary_metric, reason]
    properties:
      decision:
        type: string
        enum: [accepted, rejected, superseded, baseline, unresolved, diagnostic]
      primary_metric: {type: string}
      reason: {type: string, minLength: 1}
      commit: {type: string}
