# Compiled schema for one exploration round. Kept small on purpose: only the
# fields something reads — the plan's hypothesis table and the round's verdict —
# are promoted into YAML. Reasoning, surprises, and limits stay prose.
$schema: https://json-schema.org/draft/2020-12/schema
$id: metabrowser.loadtime:Experiment/v1
title: Experiment
type: object
additionalProperties: false
required: [id, title, date, hypotheses, subject, method, results, verdict]
properties:
  id:
    type: string
    pattern: "^exp-[0-9]{3}$"
  title:
    type: string
    minLength: 1
  date:
    type: string
    description: ISO date the measurements were taken.
  hypotheses:
    type: array
    minItems: 1
    description: Hypothesis ids from the plan's registry, e.g. H1.
    items:
      type: string
      pattern: "^H[0-9]+$"
  subject:
    type: object
    additionalProperties: false
    required: [corpus, corpus_files, host_system, browser]
    properties:
      corpus: {type: string, description: How the tree was built, e.g. build_corpus.}
      corpus_files: {type: integer, minimum: 1}
      corpus_dirs: {type: integer, minimum: 1}
      host_cpu: {type: string}
      host_system: {type: string}
      browser: {type: string}
      viewport:
        type: string
        description: Browser viewport the run was measured at, e.g. 1280x900. The tree pages rows against it.
      cold: 
        type: boolean
        description: Fresh port (empty HTTP cache) and fresh server (scan running).
  method:
    type: object
    additionalProperties: false
    required: [runs_per_condition, control, candidate]
    properties:
      runs_per_condition: {type: integer, minimum: 1}
      interleaved: {type: boolean}
      control: {type: string}
      candidate: {type: string}
      record: {type: string, description: Path to the recorded runs.}
  results:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [metric, control_median, candidate_median, overlapping]
      properties:
        metric: {type: string}
        control_median: {type: number}
        candidate_median: {type: number}
        control_range: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
        candidate_range: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
        change_pct: {type: number}
        overlapping:
          type: boolean
          description: Ranges overlap, so this metric is not a result on its own.
  complexity:
    type: object
    additionalProperties: false
    properties:
      lines_changed: {type: integer, minimum: 0}
      new_dependencies: {type: array, items: {type: string}}
      new_failure_modes: {type: array, items: {type: string}}
      notes: {type: string}
  verdict:
    type: object
    additionalProperties: false
    required: [decision, primary_metric, reason]
    properties:
      decision:
        type: string
        enum: [accepted, rejected, superseded, baseline, unresolved]
      primary_metric: {type: string}
      reason: {type: string, minLength: 1}
      commit: {type: string}
