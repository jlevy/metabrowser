<!-- render-svg refuses: unsupported attribute edgeMode on <feGaussianBlur> -->
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
<g filter="url(#blur)">
<rect x="4" y="4" width="8" height="8" fill="#FF0000"/>
</g>
<defs>
<filter id="blur" x="0" y="0" width="16" height="16" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feGaussianBlur stdDeviation="1" edgeMode="wrap"/>
</filter>
</defs>
</svg>
