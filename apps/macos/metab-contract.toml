# What the macOS app depends on in `metab`: every command it runs, every route it asks,
# every line and JSON field it reads, every variable it sets, and every value it copies.
#
# This file is the one declaration of that contract. Three checks read it, and
# docs/project/architecture/arch-app-contract.md says what each catches:
#
# - tests/test_app_contract_golden.py runs each `command` and `route` through `metab` and
#   writes what the app reads of the answer, and nothing else, to
#   tests/golden/app-contract.txt.
# - Tests/ShellCoreTests/AppContractTests.swift holds the app to that file: its own
#   argument builders write the command lines, and its own readers read the answers.
# - devtools/check_app_contract.py, in `make lint-check`, compares this file with the
#   app's Swift sources and with the golden, in both directions.
#
# A change to what this file declares, to the golden, or to a value the app copies is a
# change to the contract, which ships in a minor or major release of `metab` and is named
# in the changelog (the architecture document's "Versioning").
# `python -m devtools.check_app_contract report` prints the inventory.

# ── Commands ────────────────────────────────────────────────────────────────────────────
#
# `argv` is what follows `metab`, with `{name}` for a value that varies. `source` is the
# Swift file that writes it. `json` lists the keys the app reads, `a.b` for a key of an
# object and `a[].b` for a key of each element; `values` lists the values of a key the
# app tells apart; `stdout` and `stderr` name the `line` entries the app reads there.
# `shown` lists keys whose text the app shows a person and never reads, and `opaque` keys
# whose value it keeps or hands back unread: the golden records that each is there, as
# `<text>` or `<opaque>`, and not what it says, so a reworded message is no change to the
# contract. A value of a `values` key that is none of the values listed is recorded as
# `<other>`: the app treats every such value alike. `output = "shown"` is a whole output
# the app shows as written.
# `app_runs = false` is a command the app never runs, kept because the golden needs it to
# show something the app depends on; `because` says what.

[[command]]
id = "version-probe"
argv = ["--exit-on-eof", "--present", "--recent", "--version"]
source = "Sources/ShellCore/Runtime/RuntimeDiscovery.swift"
stdout = ["version"]
note = "Setup's check of a `metab`: every flag the app needs that a version number cannot show, then --version. Exit 0 prints the version."

[[command]]
id = "version"
argv = ["--version"]
source = "Sources/ShellCore/Runtime/RuntimeDiscovery.swift"
stdout = ["version"]
note = "Asked after the probe was rejected, to name the version of a build that is too old."

[[command]]
id = "unknown-option"
argv = ["--no-such-option-for-the-app-contract", "--version"]
source = "Sources/ShellCore/Runtime/RuntimeDiscovery.swift"
app_runs = false
because = "A build from before one of the probe's flags rejects it as this build rejects an option it does not know: exit status 2, naming the option, which is how the app tells a build that is too old (`rejectsServeFlag`)."
stderr = ["names-the-option"]

[[command]]
id = "serve"
argv = ["{root}", "--no-open", "--exit-on-eof", "--host", "127.0.0.1", "--port", "{port}"]
source = "Sources/ShellCore/Supervision/ServerLaunch.swift"
stdout = ["serving"]
stderr = ["clone-started", "cloned", "clone-cached"]
note = "One server per folder or repository. The app reads its address from the Serving line, and for a repository says what the clone report says while it waits."

[[command]]
id = "serve-path"
argv = ["{root}", "--no-open", "--exit-on-eof", "--host", "127.0.0.1", "--port", "{port}", "--path", "{path}"]
source = "Sources/ShellCore/Folders/OpenTarget.swift"
app_runs = false
because = "The app opens a file by loading its view address on the folder's server, which it spells by itself (`PageAddress.view(of:)`); this is the address `metab` announces for the same file."
stdout = ["serving"]

[[command]]
id = "present-dry-run"
argv = ["{link}", "--present", "--dry-run", "--format", "json"]
source = "Sources/ShellCore/Folders/PresentPlan.swift"
json = ["kind", "root", "handoff", "refusal.code", "refusal.message"]
values = { kind = ["repository", "pull_request", "commit", "tree", "file"] }
shown = ["refusal.message"]
note = "What a GitHub link opens, for a link sent to the app and for File > Open URL…. Exit 0 with a plan; a refusal exits nonzero and still prints the object."

# `targets[].git` says a folder was a Git checkout when it was opened, which picks its mark
# (`RootMark`) without a look at the folder, which can raise a privacy prompt.
[[command]]
id = "recent-list"
argv = ["--recent", "--json"]
source = "Sources/ShellCore/Folders/RecentTargets.swift"
json = ["targets[].mode", "targets[].root", "targets[].opened_at", "targets[].git", "problem"]
values = { "targets[].mode" = ["folder", "mirror"] }
shown = ["problem"]
opaque = ["targets[].opened_at"]
note = "File > Open Recent and the Dock menu."

[[command]]
id = "recent-add"
argv = ["{target}", "--recent-add"]
source = "Sources/ShellCore/Folders/RecentTargets.swift"
note = "Records each open the app makes, once, as it shows it: no server the app starts records. Only the exit status is read."

[[command]]
id = "recent-forget"
argv = ["{root}", "--recent-forget"]
source = "Sources/ShellCore/Folders/RecentTargets.swift"
note = "Drops a folder that is gone. Only the exit status is read."

[[command]]
id = "recent-clear"
argv = ["--recent-clear"]
source = "Sources/ShellCore/Folders/RecentTargets.swift"
note = "Clear Menu. Only the exit status is read."

[[command]]
id = "cache-sources"
argv = ["{folder}", "--api", "/api/cache/sources?limit={limit}{after}", "--format", "json"]
source = "Sources/ShellCore/Folders/RepositoryCache.swift"
json = ["sources[].identity.display_url", "sources[].publication", "sources[].problems", "next_after"]
values = { "sources[].publication" = ["published"] }
opaque = ["next_after"]
note = "Whether the cache holds a repository, asked before a link clones one. The app's limit is `RepositoryCache.pageLimit`; a smaller one in the golden shows the cursor."

[[command]]
id = "event-log"
argv = ["{folder}", "--api", "/api/event-log?limit=1", "--format", "json"]
source = "Sources/ShellCore/Folders/EventLogLocation.swift"
json = ["directory", "files[].name"]
note = "Help > Open Event Log: where Metabrowser's own event log is and which segment is newest, asked of the route that lists it, newest first. `{folder}` is any folder, whose server is never started, and `--api` writes the folder it serves as `<ROOT>`, so the app passes its own support folder, which is not the log's directory."

[[command]]
id = "plugins"
argv = ["--plugins", "--json"]
source = "Sources/ShellCore/Setup/PluginInventory.swift"
json = ["plugins[].name", "plugins[].display_name", "plugins[].version", "plugins[].source", "plugins[].requires[]", "errors[]"]
shown = ["plugins[].display_name", "plugins[].version", "plugins[].source", "errors[]"]
note = "Settings > Plugins uses the selected metab and the server's environment, when the tab first shows it and on Refresh. A partial discovery exits 1 and still prints the plugin list with its errors."

[[command]]
id = "doctor"
argv = ["--doctor", "--json"]
source = "Sources/ShellCore/Setup/DoctorReport.swift"
json = [
    "ok",
    "problems[]",
    "checks[].id",
    "checks[].title",
    "checks[].state",
    "checks[].summary",
    "checks[].details[].name",
    "checks[].details[].value",
    "checks[].remedy.text",
    "checks[].remedy.command",
    "checks[].remedy.url",
    "github.state",
    "github.message",
    "github.remedy.text",
    "github.remedy.command",
    "github.remedy.url",
    "github.gh_path",
    "github.gh_version",
    "github.gh_minimum",
    "github.account",
]
values = { "checks[].state" = ["ok", "warning", "problem"], "github.state" = ["ok"] }
shown = [
    "problems[]",
    "checks[].title",
    "checks[].summary",
    "checks[].details[].name",
    "checks[].details[].value",
    "checks[].remedy.text",
    "checks[].remedy.command",
    "checks[].remedy.url",
    "github.message",
    "github.remedy.text",
    "github.remedy.command",
    "github.remedy.url",
    "github.gh_path",
    "github.gh_version",
    "github.gh_minimum",
    "github.account",
]
note = "Settings > Check Setup, which Help > Check Setup… opens: one row of the report per entry of `checks`, the plugins and `open_in` among them, then GitHub CLI, each with its step from a `remedy` object; `problems` is read only from a report without `checks`, and a check's `id` names its row. A report with a problem exits 1 and is still a report. It runs with a server's environment (`ChildEnvironment`, the behavior python-environment) and no working directory, so a folder's `.env` never reaches it, and it names the app's bundle in METABROWSER_DOCTOR_APP."

[[command]]
id = "acquire"
argv = ["{url}", "--no-serve"]
source = "Sources/ShellCore/Folders/GitHubFailure.swift"
app_runs = false
because = "The app never runs it: it is the command the status view tells a person to try in Terminal when a clone failed on the network."
output = "shown"

# ── Routes ──────────────────────────────────────────────────────────────────────────────
#
# What the app asks a ready server over HTTP. `literal` is the route as the Swift source
# spells it. The golden asks each with `metab ROOT --api ROUTE`, which issues the request
# the app issues and prints the status the app checks; `data` is the JSON body of a route
# the app posts to, which the golden sends with `--data`.

[[route]]
id = "identity"
route = "/api/identity"
literal = "api/identity"
source = "Sources/ShellCore/Folders/FolderIdentity.swift"
json = ["short_name", "full_name", "kind", "kind_label", "title"]
values = { kind = ["folder", "git", "mirror"] }
note = "Names each window, and which of the three kinds of root it shows, which picks its mark (`RootMark`). Status 200, or the window keeps the name it derived."

[[route]]
id = "source-status"
route = "/api/source/status"
literal = "api/source/status"
source = "Sources/ShellCore/Folders/SourceLink.swift"
json = ["refreshing"]
note = "Whether the refresh a link the mirror lacked waits for still runs (`SourceLink`): the app asks the link route again once it is false."

[[route]]
id = "source-link"
route = "/api/source/link"
literal = "api/source/link"
data = "{body}"
source = "Sources/ShellCore/Folders/SourceLink.swift"
json = ["href", "code"]
values = { code = ["selection_pending"] }
values_in = "cli-api-source-link.txt"
note = "Opens a link into the repository a mirror's server serves, its only one: the page its window goes to (`href`), switching the pin first where the link names another revision. A ref the mirror lacks needs a refresh against an origin, which cli-api-source-link.txt records with each kind of link; any other code is not found or a refusal, which leaves the window where it was."

# ── Lines ───────────────────────────────────────────────────────────────────────────────
#
# Lines of a command's output that the app reads as text. `pattern` matches the part of
# the line the app parses, as `metab` prints it and as a golden records it; the golden
# records that part and `<text>` for whatever else the line holds, which the app shows or
# passes over. A line with `golden` is shown by that golden, not by the contract's own;
# one with `pinned_by` cannot be shown by a transcript, and that test holds the app's
# samples of it to what `metab` writes.

[[line]]
id = "version"
pattern = '^metab \S+(?: \(.*\))?$'
source = "Sources/ShellCore/Runtime/RuntimeDiscovery.swift"
note = "`metab VERSION`, then for a checkout a description. The golden's driver holds VERSION to `MetabVersion`'s pattern before it elides it."

[[line]]
id = "names-the-option"
pattern = '--no-such-option-for-the-app-contract'
source = "Sources/ShellCore/Runtime/RuntimeDiscovery.swift"
note = "Click's wording around the option is not read."

[[line]]
id = "serving"
pattern = '^Serving .+ at http://127\.0\.0\.1:\d+/view/\S*(?:  \[dev build: [^\]]*\])?$'
source = "Sources/ShellCore/Supervision/ServerLaunch.swift"
note = "The server's announcement of its address, on stdout, before its socket listens."

[[line]]
id = "clone-started"
pattern = '^cloning \S+://\S+ into '
source = "Sources/ShellCore/Supervision/StartProgress.swift"

[[line]]
id = "cloned"
pattern = '^cloned \S+://\S+ in '
source = "Sources/ShellCore/Supervision/StartProgress.swift"

[[line]]
id = "clone-cached"
pattern = '^using the clone of \S+://\S+ cached in '
source = "Sources/ShellCore/Supervision/StartProgress.swift"

[[line]]
id = "clone-status"
pattern = '^cloning \S+://\S+: '
source = "Sources/ShellCore/Supervision/StartProgress.swift"
pinned_by = "tests/test_macos_app_pins.py::test_the_clone_report_the_app_reads_is_metabs"
note = "Written only when a clone has run ten seconds since its last line, which no transcript waits for."

[[line]]
id = "pull-request-step"
pattern = '^reading pull request \d+ \(\S+ s\)$'
source = "Sources/ShellCore/Supervision/StartProgress.swift"
pinned_by = "tests/test_macos_app_pins.py::test_the_clone_report_the_app_reads_is_metabs"
note = "Written only when GitHub takes longer than `WAIT_QUIET_S` to answer."

[[line]]
id = "error-state"
pattern = '^Error: .+ \([a-z_]+\)(?:;.*)?$'
source = "Sources/ShellCore/Folders/GitHubFailure.swift"
golden = "cli-github-not-found.txt"
pinned_by = "tests/test_macos_app_pins.py::test_the_github_failures_the_app_reads_are_metabs"
note = "The last line of a start that failed: the app reads the state in parentheses and shows the message as written."

[[line]]
id = "stdin-closed"
pattern = '^Stopping Metabrowser: stdin closed\.$'
source = "Tests/ShellCoreTests/LiveMetabTests.swift"
golden = "cli-serve-exit-on-eof.tryscript.md"
note = "Read only by the app's live test of the stdin lifeline."

# ── Variables ───────────────────────────────────────────────────────────────────────────
#
# Variables of `metab`'s that the app sets for a child. `metab` is where it is read.

[[env]]
name = "METABROWSER_RECORD_RECENT"
source = "Sources/ShellCore/Folders/RecentTargets.swift"
metab = "src/metabrowser/recent_targets.py"
note = "Set to 0 for every server the app starts: the app records each open itself, as it shows it, with `--recent-add`. Any other `metab` the app runs gets the app's own value, so a development build started with 0 (`make run`) records nothing."

[[env]]
name = "METABROWSER_DOCTOR_APP"
source = "Sources/ShellCore/Setup/DoctorReport.swift"
metab = "src/metabrowser/cli/doctor.py"
note = "Set to the app's own bundle when Check Setup… runs the doctor, whose metab check then compares with that build's MetabrowserMinimumMetab rather than the app LaunchServices finds first."

[[env]]
name = "METABROWSER_STATE_DIR"
source = "Sources/ShellCore/Runtime/ChildEnvironment.swift"
golden = "cli-api-event-log.tryscript.md"
metab = "src/metabrowser/home.py"
note = "Not set by the app: passed through from the app's own environment, with XDG_STATE_HOME, so a server it starts writes its event log (metabrowser.event_log) where a terminal's would."

[[env]]
name = "METABROWSER_EVENT_LOG"
source = "Sources/ShellCore/Runtime/ChildEnvironment.swift"
golden = "cli-api-event-log.tryscript.md"
metab = "src/metabrowser/event_log.py"
note = "Not set by the app: passed through from the app's own environment, so 0 turns the event log off for the servers it starts too."

[[env]]
name = "METABROWSER_CONFIG_DIR"
source = "Sources/ShellCore/Runtime/ChildEnvironment.swift"
metab = "src/metabrowser/home.py"
golden = "cli-recent.tryscript.md"
note = "Not set by the app: passed through from the app's own environment to every `metab` it runs, so the `--recent-add` that records an open and the `--recent` that lists the menu read one list, and a development build started with a scratch directory, as the hand checks start one, leaves the user's list alone. The app's live tests set it too, so that a test's folder stays out of the recent targets of whoever runs them."

# ── Behavior ────────────────────────────────────────────────────────────────────────────
#
# What the app relies on that is neither a field nor a line. Each names what holds
# `metab` to it in `pinned_by`: a Python test or a test of the app's, as `path::name`, or
# a browserless session under tests/dom or a golden, as its path, with the text in `holds`
# that the file must contain. So what the app's own script relies on in a page, such as a
# selector, is declared here and pinned by the session that renders the page.
# `values` names what `metab` defines for it, which tests/golden/app-contract-copies.txt
# records, so that a changed value is a change to the contract.

[[behavior]]
id = "web-view-link"
source = "Sources/ShellCore/Web/WebViewRequests.swift"
what = "A page marks a link that opens in the app's web pane `data-web-view=\"open\"`, as the View on GitHub button's main link is: an `a` whose `href` is a page on a site the app knows (`WebSite.known`), with `target=\"_blank\"` and `rel=\"noopener\"`. The app's script takes a plain click on that link and opens its pane there, in a popover; any other click is the link's own, which opens a new window that the app hands to the default browser."
pinned_by = "tests/golden/cli-ui-counterpart.tryscript.md"
holds = '"data-web-view": "open"'

[[behavior]]
id = "open-file-link"
source = "Sources/ShellCore/Web/OpenFileRequests.swift"
what = "A page marks a link that opens its file in the file's default app `data-metabrowser-open-file`, as the `pdf` plugin's Open is: an `a` whose `href` is the file's `/raw?path=<identity>` on the server's own origin, whose `download` is the file's name, and whose marker's value is `filesystem`, for a path relative to the folder's root, or `git_revision`, for a pinned revision's or a mirror's identity. The page draws it only when the app's host descriptor, a frozen `window.metabrowserHost`, lists the action `open-file` (`HostDescriptor`). The app's script takes a plain click on that link and opens the file under the folder, or a downloaded copy of the link's bytes; any other click is the link's own, a download."
pinned_by = "tests/golden/cli-ui-pdf-preview.tryscript.md"
holds = '"data-metabrowser-open-file": "filesystem"'

[[behavior]]
id = "navigation-history"
source = "Sources/ShellCore/Web/NavigationHistoryRequests.swift"
what = "The optional navigation-history host action lets a committed page exchange Back and Forward availability, shortcut requests, Shift hints, and page labels with the native shell. Messages name the exact current internal URL. Native history buttons and standard menu shortcuts remain available if the server does not implement the bridge."
pinned_by = "tests/golden/cli-ui-key-reveal.tryscript.md"
holds = '{"kind":"history","direction":"back","url":"http://127.0.0.1:8457/pull/927"}'

[[behavior]]
id = "raw-media-type"
source = "Sources/ShellCore/Web/OpenFileDownloads.swift"
what = "`/raw?path=<identity>` answers with a `Content-Type` that names the file's media type: the one its name's extension gives, or, for a name that gives none, the one its leading bytes give where they name one (`content_sniff.media_type_from_prefix`: a PDF's `%PDF-`), else `application/octet-stream`. The app names an Open link's downloaded copy by it (`OpenFileTypes.copyName`), so a pinned revision's PDF named `untitled` is kept as `untitled.pdf` and opens in the Mac's PDF app. A `metab` that answers `application/octet-stream` leaves the copy its name, which the app refuses, as before."
pinned_by = "tests/golden/cli-ui-pdf-surfaces.tryscript.md"
holds = "pin · app · scans/untitled: viewer; no first page (no_sandbox). Open → 200 application/pdf"

[[behavior]]
id = "json-framing"
source = "Sources/ShellCore/Folders/PresentPlan.swift"
what = "A JSON answer on stdout is one block from a line that is exactly `{` to a line that is exactly `}`, and no other line of either stream is `{`, `}`, or a whole object: the app finds the answer by those lines in the one pipe that carries both streams."
pinned_by = "apps/macos/Tests/ShellCoreTests/AppContractTests.swift::openRecentListsWhatMetabRecorded"

[[behavior]]
id = "python-environment"
source = "Sources/ShellCore/Runtime/ChildEnvironment.swift"
what = "The app starts every `metab` with PYTHONUNBUFFERED=1 and PYTHONNOUSERSITE=1, which the interpreter reads: the Serving line reaches the pipe as it is printed, and a package in the user's site directory does not shadow one of metab's."
pinned_by = "apps/macos/Tests/ShellCoreTests/RuntimeDiscoveryTests.swift::keepsIdentityLocaleAgentAndProxiesAndDropsEverythingElse"

[[behavior]]
id = "executable-name"
source = "Sources/ShellCore/Runtime/RuntimeDiscovery.swift"
what = "The package installs a console script named `metab`, which is the file the app looks for in each place it searches."
pinned_by = "tests/test_app_contract_golden.py::test_the_apps_executable_name_matches_the_console_script"
values = ["pyproject.toml:project.scripts.metab"]

[[behavior]]
id = "stdin-lifeline"
source = "Sources/ShellCore/Supervision/ServerLaunch.swift"
what = "A server started with --exit-on-eof stops by itself, with exit status 0, when its stdin closes."
pinned_by = "tests/test_stdin_lifeline.py::test_a_server_whose_stdin_closes_stops_and_frees_its_port"
golden = "cli-serve-exit-on-eof.tryscript.md"

[[behavior]]
id = "prompt-stop"
source = "Sources/ShellCore/Supervision/ServerSupervisor.swift"
what = "A server ends within `SupervisorPolicy.shutdownGrace` of SIGTERM, because it waits for no open connection."
pinned_by = "tests/test_cli_main.py::test_serve_expands_home_relative_root"

[[behavior]]
id = "entry-page-answers"
source = "Sources/ShellCore/Supervision/ReadinessProbe.swift"
what = "The address the Serving line announces answers 2xx once the socket listens; there is no health route."
pinned_by = "tests/test_stdin_lifeline.py::test_a_server_whose_stdin_closes_stops_and_frees_its_port"

# ── Copies ──────────────────────────────────────────────────────────────────────────────
#
# Values of `metab`'s that the app holds a copy of, where nothing imports them. Each names
# the test that holds the copy to its definition: a Python test that reads the Swift
# source, or a test of the app's that reads the golden. `values` names the definitions,
# as `module:NAME`; tests/golden/app-contract-copies.txt records each, so a change to one
# changes a golden, and the app that copied the old value is the reason it is a change to
# the contract.

