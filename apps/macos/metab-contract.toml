# ── Where the app starts a process, decodes JSON, sends a request, or scripts a page ─────
#
# Every such file is listed, so one that begins to is a new dependency until it is
# declared here. A value is the ids of what the file runs or reads, or `own:` and what it
# is when it is the app's own and no part of this contract.

[files.launch]
"Sources/ShellCore/Runtime/RuntimeDiscovery.swift" = { sites = 2, runs = ["version-probe", "version", "own: the login shell, for its PATH"] }
"Sources/ShellCore/Setup/SetupGuide.swift" = { sites = 1, runs = ["own: uv tool dir --bin"] }
"Sources/ShellCore/Supervision/ServerLaunch.swift" = { sites = 1, runs = ["serve"] }
"Sources/ShellCore/Folders/PresentPlan.swift" = { sites = 1, runs = ["present-dry-run"] }
"Sources/ShellCore/Folders/RecentTargets.swift" = { sites = 1, runs = ["recent-list", "recent-add", "recent-forget", "recent-clear"] }
"Sources/ShellCore/Folders/RepositoryCache.swift" = { sites = 1, runs = ["cache-sources"] }
"Sources/ShellCore/Setup/DoctorReport.swift" = { sites = 1, runs = ["doctor"] }

# In a file that reads one of the contract's answers, every key it names in a subscript
# or as a coding key's raw value is one the answer's entry declares. A subscript of
# something of the app's own in such a file ends its line `// not-contract: <why>`.
[files.json]
"Sources/ShellCore/Folders/PresentPlan.swift" = ["present-dry-run"]
"Sources/ShellCore/Folders/RecentTargets.swift" = ["recent-list"]
"Sources/ShellCore/Folders/RepositoryCache.swift" = ["cache-sources"]
"Sources/ShellCore/Folders/FolderIdentity.swift" = ["identity"]
"Sources/ShellCore/Folders/LinkSelection.swift" = ["source-status"]
"Sources/ShellCore/Setup/DoctorReport.swift" = ["doctor"]
"Sources/ShellCore/Folders/SavedSession.swift" = ["own: the app's saved session"]
"Sources/ShellCore/Runtime/Runtime.swift" = ["own: the runtime the app last settled on"]

[files.http]
"Sources/ShellCore/Folders/FolderIdentity.swift" = ["identity", "source-status"]
"Sources/ShellCore/Supervision/ReadinessProbe.swift" = ["entry-page-answers"]
"Sources/Metabrowser/FolderPage.swift" = ["own: the page a window loads, which the web view requests"]
"Sources/Metabrowser/WebPane.swift" = ["own: a known site's pages, such as github.com's, in the web pane"]

[files.script]
"Sources/ShellCore/Web/PagePrint.swift" = ["own: window.print, which WebKit gives the app no public way to receive"]
"Sources/ShellCore/Web/WebViewRequests.swift" = ["web-view-link"]
"Sources/Metabrowser/WebPane.swift" = ["own: whether the pane's page holds text not yet sent"]

# ── What the scans pass over ────────────────────────────────────────────────────────────
#
# Flags of other tools in commands the app runs or shows, and variables that are the
# app's own or the interpreter's.

[other]
flags = [
    "--bin",       # uv tool dir --bin
    "--upgrade",   # uv tool install --upgrade, shown at setup
    "--reinstall", # uv tool install --reinstall, shown at setup
    "--force",     # pipx install --force, shown for a pipx metab too old to run
    "--hostname",  # gh auth login, status, and refresh, shown when GitHub refuses
    "--scopes",    # gh auth refresh --scopes, shown when GitHub refuses
]
env = [
    "METABROWSER_METAB",            # which metab the app runs, for a development run
    "METABROWSER_SHELL_TEST_METAB", # the metab the live tests run
    "PYTHONUNBUFFERED",             # the interpreter's: the behavior python-environment
    "PYTHONNOUSERSITE",             # the interpreter's: the behavior python-environment
]
