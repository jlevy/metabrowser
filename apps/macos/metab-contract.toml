# ── The other direction ─────────────────────────────────────────────────────────────────
#
# What `metab --present` reads of the app before it hands it a target.

[[app_side]]
id = "bundle-identifiers"
what = "RELEASE_BUNDLE_ID and DEV_BUNDLE_ID in cli/present.py are the identifiers scripts/common.sh builds the two variants with."
pinned_by = "tests/test_present.py::test_the_bundle_identifiers_are_the_ones_the_app_is_built_with"
values = ["metabrowser.cli.present:RELEASE_BUNDLE_ID", "metabrowser.cli.present:DEV_BUNDLE_ID"]

[[app_side]]
id = "minimum-metab"
what = "Resources/Info.plist declares MetabrowserMinimumMetab, the app's MetabRequirement.minimumRelease, which metab --doctor reads from the app --present would open, or from the bundle METABROWSER_DOCTOR_APP names, to say whether this metab is new enough."
pinned_by = "tests/test_macos_app_pins.py::test_the_app_declares_its_minimum_metab_for_the_doctor"
values = ["metabrowser.cli.present:MINIMUM_METAB_KEY"]

[[app_side]]
id = "storage-variables"
what = "ChildEnvironment passes the app's servers, and the doctor it runs, none of STORAGE_OVERRIDES in cli/doctor.py, and of LAUNCH_STORAGE_OVERRIDES only what the app was launched with, so the doctor's configuration and cache checks warn when one set in a terminal names a directory the app's servers never read, and the doctor the app runs takes the app's own METABROWSER_CONFIG_DIR as its servers'."
pinned_by = "tests/test_macos_app_pins.py::test_the_apps_servers_get_the_storage_variables_the_doctor_expects"
values = ["metabrowser.cli.doctor:STORAGE_OVERRIDES", "metabrowser.cli.doctor:LAUNCH_STORAGE_OVERRIDES"]

[[app_side]]
id = "opens-urls-marker"
what = "Resources/Info.plist declares MetabrowserOpensURLs, which --present reads before it sends a URL, and RecentTargets.opensURLsKey names the same key."
pinned_by = "tests/test_macos_app_pins.py::test_the_app_declares_what_present_reads"
values = ["metabrowser.cli.present:OPENS_URLS_KEY"]

# ── Where the app starts a process, decodes JSON, sends a request, or scripts a page ─────
#
# Every such file is listed, so one that begins to is a new dependency until it is
# declared here. A value is the ids of what the file runs or reads, or `own:` and what it
# is when it is the app's own and no part of this contract.

[files.launch]
"Sources/ShellCore/Setup/PluginInventory.swift" = { sites = 1, runs = ["plugins"] }
"Sources/ShellCore/Runtime/RuntimeDiscovery.swift" = { sites = 2, runs = ["version-probe", "version", "own: the login shell, for its PATH"] }
"Sources/ShellCore/Setup/SetupGuide.swift" = { sites = 1, runs = ["own: uv tool dir --bin"] }
"Sources/ShellCore/Supervision/ServerLaunch.swift" = { sites = 1, runs = ["serve"] }
"Sources/ShellCore/Folders/PresentPlan.swift" = { sites = 1, runs = ["present-dry-run"] }
"Sources/ShellCore/Folders/RecentTargets.swift" = { sites = 1, runs = ["recent-list", "recent-add", "recent-forget", "recent-clear"] }
"Sources/ShellCore/Folders/EventLogLocation.swift" = { sites = 1, runs = ["event-log"] }
"Sources/ShellCore/Folders/RepositoryCache.swift" = { sites = 1, runs = ["cache-sources"] }
"Sources/ShellCore/Setup/DoctorReport.swift" = { sites = 1, runs = ["doctor"] }

# In a file that reads one of the contract's answers, every key it names in a subscript
# or as a coding key's raw value is one the answer's entry declares. A subscript of
# something of the app's own in such a file ends its line `// not-contract: <why>`.
[files.json]
"Sources/ShellCore/Setup/PluginInventory.swift" = ["plugins"]
"Sources/ShellCore/Folders/PresentPlan.swift" = ["present-dry-run"]
"Sources/ShellCore/Folders/RecentTargets.swift" = ["recent-list"]
"Sources/ShellCore/Folders/EventLogLocation.swift" = ["event-log"]
"Sources/ShellCore/Folders/RepositoryCache.swift" = ["cache-sources"]
"Sources/ShellCore/Folders/FolderIdentity.swift" = ["identity"]
"Sources/ShellCore/Folders/SourceLink.swift" = ["source-link", "source-status"]
"Sources/ShellCore/Setup/DoctorReport.swift" = ["doctor"]
"Sources/ShellCore/Folders/SavedSession.swift" = ["own: the app's saved session"]
"Sources/ShellCore/Runtime/Runtime.swift" = ["own: the runtime the app last settled on"]

[files.http]
"Sources/ShellCore/Folders/FolderIdentity.swift" = ["identity", "source-status"]
"Sources/ShellCore/Folders/SourceLink.swift" = ["source-link"]
"Sources/ShellCore/Supervision/ReadinessProbe.swift" = ["entry-page-answers"]
"Sources/Metabrowser/FolderPage.swift" = ["own: the page a window loads, which the web view requests"]
"Sources/Metabrowser/WebPane.swift" = ["own: a known site's pages, such as github.com's, in the web pane"]
"Sources/ShellCore/Web/OpenFileDownloads.swift" = ["open-file-link", "raw-media-type"]

[files.script]
"Sources/Metabrowser/FolderPage.swift" = ["navigation-history"]
"Sources/ShellCore/Web/NavigationHistoryRequests.swift" = ["navigation-history"]
"Sources/ShellCore/Web/PagePrint.swift" = ["own: window.print, which WebKit gives the app no public way to receive"]
"Sources/ShellCore/Web/WebViewRequests.swift" = ["web-view-link"]
"Sources/ShellCore/Web/OpenFileRequests.swift" = ["open-file-link"]
"Sources/ShellCore/Web/HostDescriptor.swift" = ["open-file-link"]
"Sources/Metabrowser/WebPane.swift" = ["own: whether the pane's page holds text not yet sent"]
"Sources/ShellCore/Web/PageFind.swift" = ["own: the page's selection, which find reads and starts from, through the DOM's own Selection"]

# ── What the scans pass over ────────────────────────────────────────────────────────────
#
# Flags of other tools in commands the app runs or shows, and variables that are the
# app's own or the interpreter's.

[other]
flags = [
    "--bin",       # uv tool dir --bin
    "--hostname",  # gh auth login, status, and refresh, shown when GitHub refuses
    "--scopes",    # gh auth refresh --scopes, shown when GitHub refuses
]
env = [
    "METABROWSER_METAB",            # which metab the app runs, for a development run
    "METABROWSER_SHELL_TEST_METAB", # the metab the live tests run
    "PYTHONUNBUFFERED",             # the interpreter's: the behavior python-environment
    "PYTHONNOUSERSITE",             # the interpreter's: the behavior python-environment
]
