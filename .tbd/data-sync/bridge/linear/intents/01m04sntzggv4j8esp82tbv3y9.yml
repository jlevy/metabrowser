  - bead_id: is-01kzsbr5a47fs63xkz2rzcgcr9
    client_id: 76eb6a23-1ca4-4b82-b473-18f5a660afd6
    kind: create_issue
    patch:
      description: >-
        The last engineering gap on the Git graph branch. Everything else is
        automated-green; graph *proportions* have never had a human sign-off, which is
        why the PR is still titled a spike.


        Checklist (from the PR body):

        - metab . in a repository: Git tab appears, lanes sensible, badges on the right
        commits, HEAD ring on the checked-out commit.

        - Lane colours and columns stay continuous across the 250-row paging boundary;
        no jump.

        - Hover a row: full message and 'files changed / +N -N' card after ~300ms.
        Click: detail view. Click a changed file: file opens.

        - Light and dark themes: lanes legible, badges readable, hollow HEAD ring
        matches the row background in default, hover, AND selected states (the selected
        case is new in R16).

        - Non-repository directory: no Git tab, no console errors. Repository
        subdirectory: files outside the served root listed but inert.

        - Fresh git init with no commits: 'No commits yet', not an error.

        - New since the #30 merge: the filter bar is hidden under the Git tab and
        restored on return, and the Refresh button now carries the .btn family focus
        ring.


        When this passes, drop 'spike: needs visual validation' from the PR title.
      parentId: 4d050c3e-9bbe-48bb-9342-75daa56bd295
      priority: 1
      status: open
      title: "PR #24: human visual validation pass of the Git graph"
