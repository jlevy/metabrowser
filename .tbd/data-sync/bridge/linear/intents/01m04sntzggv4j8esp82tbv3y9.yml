  - bead_id: is-01kzcvmq7ry46jxy4gcde7x4cq
    client_id: aa27e880-f003-4490-80ca-7e9c75b72c12
    kind: create_issue
    patch:
      description: "Ship independently of any UI change; both halves of the content/API
        boundary land together. (1) Shared response-header builder on all three raw_file
        branches (incl. gzip passthrough): unconditional 'Content-Security-Policy:
        sandbox allow-scripts allow-popups allow-forms allow-downloads' plus
        'X-Content-Type-Options: nosniff' on every raw response — no script-capable type
        list, and deliberately NO frame-ancestors (it would break nested
        iframes/framesets in previewed pages, since the opaque-origin ancestor never
        matches 'self'). (2) Same-origin proof on /api/* in _HostValidationMiddleware:
        accept Sec-Fetch-Site: same-origin or a matching Origin; reject Origin: null and
        foreign origins; keep no-header requests (curl) working. State-changing routes
        require the application/json Content-Type header explicitly — request.json()
        ignores the header today, so POST /api/kpress/export (which WRITES under the
        root) is cross-site CSRF-able right now. (3) Regression tests: gzip branch,
        .svg, nested-frame loading, cross-origin /api rejection matrix. (4) Rewrite the
        SECURITY.md not-yet-enforced list into enforced guarantees."
      parentId: efc46703-5aa2-49d6-8195-546330186e9c
      priority: 1
      status: open
      title: "HTML P1: sandbox /raw responses and require same-origin proof on /api"
