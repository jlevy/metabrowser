  - bead_id: is-01m041tjpb6dxha8h5yfjs9jqw
    client_id: 77699871-6531-4807-bf2b-7ab3f8625ff0
    kind: create_issue
    patch:
      description: >-
        Reported 2026-08-15: while a large folder loads slowly, the File Breakdown panel
        shows its pulsing skeleton bars but the Files panel above it does not, so the
        top of the Overview reads as empty or as settled numbers while the section below
        is visibly still working.


        Code context: folder_totals.js renders '.folder-totals-loading' (a single 44px
        pulsing block) only when normalizeFolderTotals() returns pending, which requires
        ALL of total_files/total_size/unignored_files/unignored_size to be missing. With
        partial or zeroed envelope data it renders a table instead - potentially of
        zeros - so there is no visible pending state. File Breakdown by contrast waits
        for a terminal rollup generation and shows '.file-type-summary-skeleton'
        (multiple bars) throughout.


        NOT yet reproduced under instrumentation: attempts to catch it in the browser
        kept losing the race once the index warmed. Reproduce with a cold server on a
        large root (e.g. metab /Users/levy/wrk/github) and sample both panels within the
        first ~2s of selecting a big unscanned folder. Confirm whether Files shows a
        zeroed table, an invisible skeleton, or nothing, then make its pending treatment
        match the Breakdown's.
      parentId: da29ec9a-dfad-45c8-96a5-c5866a6ac816
      priority: 2
      status: open
      title: Files section lacks the pending skeleton that File Breakdown shows
