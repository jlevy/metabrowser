  - bead_id: is-01kzt6hdasbhx6maqzvtxntxj7
    client_id: 7766c0ab-8af4-4ee0-a3c5-d984d20cb1db
    kind: create_issue
    patch:
      description: >-
        Deferred optimization for repositories where the Phase 1 blobless path is still
        too slow. Clone --depth=1 --single-branch --filter=blob:none (django: 14.6s,
        14MB .git) and deepen in pages: fetch --deepen=500 measured 1.25s for the first
        500 commits, ~12,500 commits at 35MB, versus a 90s all-or-nothing --unshallow.


        Hard requirements: blame MUST be disabled while .git/shallow exists (a shallow
        blame exits 0 and attributes every line to the graft-boundary commit), and
        history must be marked truncated at the boundary. /api/git/ needs to report
        shallow-state capability so the panel can honor it.


        Not needed for the feature to work end to end — Phase 1 opens django in 16.5s.
        Start when a repo large enough to justify it is actually in the way.
