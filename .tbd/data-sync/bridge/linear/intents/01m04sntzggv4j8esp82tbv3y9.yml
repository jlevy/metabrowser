  - bead_id: is-01kzpz3txn7m46njwk82njfwvg
    client_id: 0318dd18-eb0f-4c87-b3f4-1d820412aa64
    kind: create_issue
    patch:
      description: "Type and size are decided client-side over rendered rows, so their answer
        is bounded by what has been expanded. For a very large directory that becomes
        incomplete rather than merely slow, which is the threshold worth moving on (see
        docs/architecture.md, 'Where Filtering Happens'). Extension and size are cheap
        index predicates and compose with the existing recency scan; activity is not a
        candidate, since the live set is small, client-held and already complete. Costs:
        a round trip per change on controls that feel instant today, cache keys
        multiplied by filter combination, and a dimension evaluated in two places that
        can disagree. FilterState already holds the vocabulary and the shared
        predicates, so a dimension can move tiers without changing meaning. Blocked on
        the planned server-side traversal work."
      parentId: acf60561-e724-4f66-85e2-3a8e6de21eec
      priority: 3
      status: open
      title: Optionally mirror extension and size filters upstream
