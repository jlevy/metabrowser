  - bead_id: is-01kzcwmhbancvf58sxae7c6qpf
    client_id: 3bbdd03f-269a-484a-bdf2-784a5d7a9290
    kind: create_issue
    patch:
      description: "Source review of watchfiles' Rust layer (attic/watchfiles/src/lib.rs)
        shows notify's EventKind::Other + Flag::Rescan — emitted on inotify Q_OVERFLOW,
        FSEvents MustScanSubDirs, and Windows buffer overruns — is silently discarded in
        the event-mapping else branch. Metabrowser therefore has no way to learn its
        inventory is incomplete after large event bursts (git checkout, npm install); it
        diverges until restart. Not fixable through the watchfiles API. Mitigations:
        periodic reconciliation sweep in watch_backends.py, or the fdu-watch layer
        (research-2026-08-06-file-rollup-engine.md) which handles Rescan as
        InvalidateSubtree. Found during fdu watch-layer research."
      priority: 2
      status: open
      title: Watcher can silently miss kernel event-queue overflow (watchfiles drops notify's
        Rescan flag)
