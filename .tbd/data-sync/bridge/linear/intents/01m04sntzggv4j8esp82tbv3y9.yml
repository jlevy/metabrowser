  - bead_id: is-01kzcvmr0d1eyegyds8zpbffbz
    client_id: 4c13f679-cdd5-48b6-9f28-d6cd16cc62de
    kind: create_issue
    patch:
      description: 'Add a built-in html kind for .html/.htm with preview and source views. A
        bounded 4 KiB sniff (doctype/<html/<head/<body/<frameset, BOM- and
        comment-tolerant) selects the default view only, never gates the feature.
        Preview renders an iframe with sandbox="allow-scripts allow-popups allow-forms
        allow-downloads" and referrerpolicy="no-referrer" — never allow-same-origin,
        never allow-top-navigation — with a disposal path. Fidelity envelope = file://
        parity: classic scripts/styles/images/nested frames work; localStorage,
        same-document fetch, ES modules, CORS webfonts do not (and /raw must never send
        Access-Control-Allow-Origin to compensate). Suppress the preview view when
        active_content is off. Document the preview, its containment, and the invariant
        in SECURITY.md as shipped guarantees.'
      parentId: efc46703-5aa2-49d6-8195-546330186e9c
      priority: 1
      status: open
      title: "HTML P4: html kind, full-page detection, and sandboxed preview"
