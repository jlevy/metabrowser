  - bead_id: is-01kzcvm6cpe5b8sb9b9n3gb16g
    client_id: efc46703-5aa2-49d6-8195-546330186e9c
    kind: create_issue
    patch:
      description: "Render full-page static HTML in an opaque-origin sandbox, and introduce
        the explicit trust model that makes it safe by default. Governing invariant:
        content viewed through Metabrowser gets exactly the privilege a browser would
        give the same file opened directly (file:// parity), and never Metabrowser's
        server-side API. Also closes two existing holes: /raw executes in-root HTML/SVG
        on the app origin, and /api accepts cross-site fire-and-forget requests (POST
        /api/kpress/export writes under the root today). SECURITY.md 'Content Trust
        Model' section documents current truth; the spec owns the deltas. See the spec
        for design and phasing."
      parentId: 4bf23327-faca-40ed-b28b-0b3870993e50
      priority: 1
      status: open
      title: HTML rendering and an explicit content-trust model
