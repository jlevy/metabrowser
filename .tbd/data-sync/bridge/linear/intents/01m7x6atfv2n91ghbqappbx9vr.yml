  - bead_id: is-01m3te95dfdnc80j5xywqje9ke
    external_id: 9522c55a-9e04-474a-a3f6-a8899cfc25bc
    kind: update_issue
    patch:
      description: >-
        ## Goal


        Give the v0.12 stack the maximum coverage of public contracts for the minimum
        test complexity. Remove or restructure tests that are vacuous, spurious or
        redundant, and prefer concise golden tests wherever they carry the same
        evidence. The user's request: "make sure that it has the maximum coverage but
        the minimum complexity of the tests. We should have any tests that are vacuous
        or spurious removed or restructured so that we use cleaner, more concise golden
        testing wherever possible."


        ## Why now


        Over `origin/main`, the stack tip (a896d8fe, `origin/codex/v012-p4-fixes`) adds
        about 61k lines of tests against about 45k lines of product source, of which
        about 13.5k is the retired Hosted Review layer (mb-whmn).


        Measured on 2026-09-30 (lines: `git grep -c ''` on each ref; run time: CI `test
        (3.13)` job logs, run 35634453594 for main and 36077428696 for the tip):


        | Measure | main | tip |

        |---|---|---|

        | `tests/test_*.py` files / lines | 203 / 49,436 | 287 / 83,818 |

        | test helper modules, lines | 323 | 1,839 |

        | `tests/dom` JS files / lines | 84 / 33,638 | 94 / 37,949 |

        | `tests/golden` files / lines | 24 / 6,058 | 54 / 17,373 |

        | `tests/fixtures` files / lines | 30 / 958 | 59 / 10,236 |

        | `def test_` functions | 1,899 | 2,899 |

        | pytest items collected in CI | 2,186 | 3,787 |

        | skipped in CI | 0 | 27 |

        | pytest wall time in CI | 64.0 s | 269.9 s |

        | tryscript blocks / wall time in CI | 131 / 37.7 s | 278 / 138.8 s |


        Tests grew 1.7x; pytest time grew 4.2x and tryscript time 3.7x. The `test` job
        runs on four Python versions, and 24 of the slowest files run again in two
        `admitted-git` jobs.


        ## Method


        1. Apply `tbd guidelines general-testing-rules`, `golden-testing-guidelines`,
        `general-tdd-guidelines`, `ci-and-gates-rules`, and the repo's own rules in
        `docs/e2e-testing.md` and `docs/development.md` ("CLI and Functional UI
        Parity").

        2. Work area by area through the child beads. Each child names its scope, the
        surveyed findings with file:line, the rule each breaks, the restructuring, and
        what must stay.

        3. For every test, state the contract, boundary, failure mode or failure
        location it adds that the rest of the suite does not. If that cannot be written,
        merge or remove it.

        4. Prefer, in order: delete a vacuous test; collapse repeated examples into a
        table or one compact golden; move CLI-observable behavior from Python into a
        tryscript golden; move browser interaction from source-text assertions into a
        browserless session; keep a focused Python test only where it gives an
        invariant, speed or failure location the public interface cannot.

        5. Line coverage is a discovery tool only. The suite has no coverage tooling
        today (`uv.lock` has neither `coverage` nor `pytest-cov`); the baseline child
        bead decides whether to add it.


        ## Accept rule (applies to every child)


        - Every removed or merged test names, in the PR description, the independent
        evidence that still covers its contract (test, golden block or session, by path
        and line).

        - Coverage of public contracts does not drop: `devtools/check_parity.py` stays
        green, and no route, kind, CLI mode, persisted state or failure class loses its
        last evidence.

        - `make verify` is green.

        - Test lines (Python, DOM JS, goldens, fixtures) and run time (pytest and
        tryscript, from the CI `test (3.13)` job) are reported before and after in each
        PR and totalled here when the epic closes.
      labels:
        - linear
        - Improvement
