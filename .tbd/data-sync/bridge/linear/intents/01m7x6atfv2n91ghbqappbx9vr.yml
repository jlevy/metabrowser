    external_id: c5f1e322-b8de-4351-8877-3b910724f569
    kind: update_issue
    patch:
      description: >-
        Front-to-back performance pass. Measured on this machine, synthetic corpora,
        Chromium 141.


        Browser cold load: 100k files -> FCP 92 ms, first tree row 4,525 ms, 2,550 rows,
        28,711 DOM nodes. 1M files (walker truncates at 500,000) -> FCP 176 ms, first
        tree row 22,328 ms, 25,122 rows, 276,789 DOM nodes.


        Waterfall at 100k: /api/tree returns 387,778 B in 38 ms at t+319 ms; /api/events
        blocks 3,669 ms; /api/catalog returns 4,580,060 B at t+4,733 ms; first row
        paints at t+4,936 ms. The tree data is in the browser at 319 ms and the client
        gates on scan completion anyway.


        Backend: start-to-serving 771 ms at 9k, 944 ms at 100k, 2,748 ms at 1M (so
        startup scales with the tree). Walk ~50 us/file. Warm /api/tree 77 ms at 9k, 866
        ms at 100k, 4,990 ms and 3.68 MB at 1M. INVENTORY_MAX_FILES = 500_000 truncates
        silently.


        Assets: 432,092 B of vendored JS on every page; blocking the Chart.js stack
        moves load from 853 ms to 479 ms.
      labels:
        - linear
        - Improvement
