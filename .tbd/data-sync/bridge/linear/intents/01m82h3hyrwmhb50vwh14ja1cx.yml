    kind: update_issue
    patch:
      description: >-
        A merge on github.com took 48 s to show on an open pull request page
        (2026-11-22), since the page polled every 30 s and the server held a record
        fresh for 60 s. This effort gives every GitHub view one update policy: probe
        what the reader can see every few seconds with conditional requests, which
        GitHub answers 304 without spending rate limit; read everything in full every
        minute or two; and keep automatic work under a self-imposed share of the hourly
        budget.


        Plan: docs/project/specs/active/plan-2026-11-22-pull-request-update-cadence.md
        (PR jlevy/metabrowser#696).


        - Phase 1 (a): probes for the pull request on screen and its pending checks.

        - Phase 1 (b): a conditional account check, so a probe or job spends no core
        call checking the sign-in.

        - Phase 2: the Pulls list probe, full-read cadence for the catalog, files list,
        and stacks, and budget admission everywhere.
