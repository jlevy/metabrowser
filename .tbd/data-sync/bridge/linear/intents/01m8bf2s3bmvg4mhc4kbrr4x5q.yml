    patch:
      description: "Owner asked 2026-11-26. Every open pull request gets one readiness verdict
        (Ready to merge, Conflicts, Checks failing, Changes requested, Checks running,
        Review required, Out of date, Blocked, Queued, Checking) in GitHub's colors: on
        the pull request page's header and a Merge status section opening the Checks
        tab, and as a glyph column in the Pulls tab and on stack member rows. GitHub's
        mergeStateStatus decides; mergeable, the checks rollup, reviewDecision, and the
        merge queue explain. Operational status (PullStatus, PullChecks) becomes a model
        and store of its own, stamped with its head, separate from the core PullRecord.
        The spec opens with GitHub's model and Metabrowser's current one."
