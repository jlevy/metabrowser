    kind: update_issue
    patch:
      description: >-
        Owner, 2026-11-19 in chat, after the macOS app's mirror of jlevy/metabrowser
        showed "main is now at 1d85c49 · Switch" at the foot of the nav pane:


        "why should this happen at all? if I've opened a working directory it should
        stay the working directory. if I've opened a branch like main it should refresh
        because we mirror things? in cloud mode it shouldn't even be a choice? in local
        branch mode on a local repo ... I think we can follow the branch because if
        someone does a fetch, we would want the latest branch ... we generally want the
        UI to follow the state of the repo. The refresh button could trigger that, but
        then it would be a refresh button, not a 'switch' button."


        The rule this replaces: "a refresh never moves the page under you" (thin-mirror
        plan 2026-09-23; docs/browsing-history.md, docs/command-line.md,
        arch-mirror-acquisition-and-refresh.md, source-pin-guard.js header).


        Target model: what the reader opened decides whether the view moves. A branch
        follows its branch; a commit ID stays; the working tree is always live. The
        children carry each part.


        Where it stands (2026-11-22):


        * Done, #632 (mb-pq8y): a mirror's pin on a branch follows the branch when a
        refresh moves it, and Refresh replaces the Switch offer, so Files and Commits
        agree.

        * Done, #631 (mb-30xb): one mirror per repository, so opening a pull request or
        any URL inside a repository reuses that repository's mirror.

        * Correct as it was: a folder's working tree is live through the watcher.

        * Not built: a revision of a checkout's branch in folder mode does not follow
        the branch (mb-0qgm).

        * Decided 2026-11-22 (mb-gkq1): Refresh in folder mode re-reads the checkout's
        refs and never fetches, as today.

        * Decided 2026-11-22 (mb-qp3s), not built: a pull request's served head follows
        new pushes, and Changes follows with a note naming the old and new head and a
        way back (mb-6a6w).

        * How soon a followed branch follows: a mirror refreshes only once its last
        fetch is a freshness window (60 s) old, so a push shows up to about 90 s later.
        mb-6pzh, under the update cadence epic mb-dip2 (OS-627), brings that to seconds.
