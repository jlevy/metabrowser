    patch:
      description: "A system-installed Metabrowser (the metab uv tool and the macOS app) uses
        new plugins without being reinstalled, and picks up a repository's checked-in
        and library-shipped plugins after one consent per clone. Plugin Python runs in
        workers on its own environment's interpreter, with a runtime package the host
        ships (metabrowser_sdk); every child process goes through one core isolation
        facility extracted from the PDF preview's sandbox and the SQLite readers, which
        separates a process that is only separate from one the operating system
        confines; a repository's plugins run confined by default; one registry with
        scoped sources lives in the state home, read fail-closed; a clone is identified
        by a token and a decision binds its environment and providers; one plugin API
        version under a caret gate; one executable. Design, eleven Key Decisions
        awaiting the owner, and phases:
        docs/project/specs/active/plan-2026-11-12-plugin-sources.md; evidence:
        docs/project/research/research-2026-11-12-plugin-sources.md; spikes and probes:
        explorations/plugin-worker-spike/."
      title: Plugin sources, process isolation, and out-of-process plugin environments
