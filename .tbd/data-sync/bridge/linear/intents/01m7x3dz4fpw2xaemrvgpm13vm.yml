    external_id: b9f5cda3-3ef2-4eab-b2b1-971ec959f502
    kind: update_issue
    patch:
      description: >-
        Owner, 2026-11-19 in chat: "when I open something like
        https://github.com/finterm-ai/trading/pull/1178 using cmd-L and paste it in, it
        does correctly open the trading repo. However, it should open the root of the
        trading repo, not treat it like an open repo specifically for the PR. If I
        opened a few PRs, they would all be in the same repo, and it should just switch
        to the appropriate PR. That's the same for anything else local to a repo. We
        should just open a repo in cloud mode if it is not already, or if it is cloud
        mirror mode already and opened we reuse that, sync and navigate to the relevant
        item."


        Expected: one mirror window (one server, keyed by the repository's address:
        SessionRoot) per repository. Opening any URL inside that repository (a pull
        request, blob, tree, commit, or branch) reuses the window and its server, starts
        a refresh, and navigates to the item (/pull/<n>, the file, the commit). If no
        mirror window exists, open the repository's mirror and land on the item.
        arch-open-modes.md, The File Menu, already says "If the mirror already has a
        window, the window switches to the branch or pull request the URL selects". Find
        where the app or `metab` keys the open on the item's URL instead of the
        repository's (SessionRoot, LinkSelection, OpenURLPanel, PresentPlan, `metab
        --present`), and fix it in the app and `metab` together (AGENTS.md: the app's
        flags and routes are internal).
