        recent (the filesPanelUsesRecentSource precedent), scoped like a filter to
        changed files, with the full change-indicator set from the File Diff Format
        (renames with old path and folder moves, type changes, mode changes, binary).
        Comparison views are injected into changed files' view descriptors with Diff as
        the context default; selection flows through navigateToPath and preferredViewId.
        Later presentations (Before, rendered-at-revision, inline-in-rendered) are
        additional tabs from the same diff layout, per the view-phasing table."
      hold: null
      resolution: completed
      slot: done
      status: closed
