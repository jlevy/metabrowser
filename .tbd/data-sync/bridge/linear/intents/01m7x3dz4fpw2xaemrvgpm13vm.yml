      description: "The owner reported that diff summaries (per-file line totals, the change
        summary) load slowly in the Pulls nav rows and on the main pull request page.
        Three children: prefetch and persist summaries as cache files and answer from
        the last persisted version first; measure the route and git/gh timings and fix
