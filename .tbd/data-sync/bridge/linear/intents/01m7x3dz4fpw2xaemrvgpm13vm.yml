    external_id: 4adbc1fb-afe9-4f50-9f55-e8ff34227388
    kind: update_issue
    patch:
      description: "Owner review SEC-1 from
        https://github.com/jlevy/metabrowser/pull/3#issuecomment-4994096399. Since
        0.12.0 the application page sends a strict Content-Security-Policy under the
        untrusted profile (--untrusted / --no-active-content):
        capabilities.untrusted_shell_csp, applied in server.py with a per-response nonce
        on the shell's inline scripts. No inline event handler remains in the shell or
        the built-in plugins. The default trusted profile still sends no CSP. Remaining:
        choose and apply a policy for the default profile that keeps the HTML preview
        frame and active content working, with tests for both profiles. Defense in
        depth; the reviewed XSS sink is fixed."
      title: "PR #3 review D: extend the strict Content Security Policy to the default
        profile"
