        client-complete unreasonable (multi-hundred-thousand-file monorepos, or past the
        500,000-file inventory cap). If built, the original scope stands: a bounded flat
        /api/search/files over a consistent inventory provider snapshot, Python and
        JavaScript fuzzy-score parity fixtures, truncation metadata, and cancellation.
        Blocked on evidence that such roots are a real use case.
