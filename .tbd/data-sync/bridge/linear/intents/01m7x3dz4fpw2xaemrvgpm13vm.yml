  - bead_id: is-01kxshfx0fhzyccg1wwtdv7c6b
    external_id: 66d2a207-9a94-44a8-afcb-f3a252eb2229
    kind: update_issue
    patch:
      description: >-
        An option from
        docs/project/research/research-2026-07-18-browser-contributor-toolchain.md: a
        pinned bundler emits reviewed vendor artifacts. Add a bundling mode to
        devtools/vendor_assets.py that produces unminified single-file ESM artifacts for
        an ESM-only package, or for a worker whose dependency graph cannot use relative
        imports alone. Commit each artifact with a sha256 manifest and license, and add
        a CI rebuild-and-compare job. The research lists what a bundle must record:
        entry point and configuration, locked input graph and licenses, emitted files,
        hashes and size limits, the determinism expectation, and source maps.


        Supply chain: esbuild 0.28.2 declares a postinstall script, so the review must
        prove a locked install and build with lifecycle scripts disabled.


        No consumer today. The Markdown module worker
        (builtin_plugins/markdown/markdown-worker-client.js) runs without bundling, and
        an ESM-only renderer such as @pierre/diffs waits on mb-k0x3's decision. Raise
        vendor size caps only per artifact. The toolchain plan (mb-h31g) decides between
        this and a full toolchain.
      parentId: fb70400d-cf16-4be7-b0c6-8ff45c3730da
      priority: 3
