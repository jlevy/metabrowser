  - bead_id: is-01m0hhjf2e1w8tp30ay4tj8183
    external_id: e89638bb-383b-4fef-882b-93118c6efc17
    kind: update_issue
    patch:
      description: >-
        Filtering and the navigation tree disagree once a filter is on. Reported from
        running Metabrowser on this repository, pulling out the nav panel, and filtering
        to a narrow type set (for example media files).


        Symptoms to fix:


        1. Folder chips still show unfiltered aggregates. Under a filter, a folder's
        file count, total size, and age should roll up from the files that survive the
        filter, not from the whole directory.

        2. Empty folders are listed. Folders whose entire subtree is filtered out still
        appear; they should never have been listed.

        3. Expanding a filtered folder makes it vanish. Expand a kept folder, its
        children load, nothing matches, and the row disappears under the cursor.

        4. Expansion can wedge. After some rows disappear, further expand clicks stop
        responding.

        5. Selection box is inset by nesting depth. In the nav panel the selection and
        hover box narrows and shifts right for nested rows. It should always span the
        full width of the panel, with indentation inside the row.


        Root cause hypothesis: filtering is a DOM decoration layer (applyTreeFilters in
        static/app.js) over rows the server already rendered from unfiltered inventory.
        It can only judge what is loaded, so a collapsed or lazily stubbed folder is
        unknown and kept, and aggregates come from the unfiltered index. The fix likely
        needs a server-side filtered projection (the /api/filter/tree work named in
        mb-tyvd phase 2) plus filtered rollups, so folder presence and folder totals are
        both answered before render.


        Also in scope: make this logic testable from the CLI (headless DOM behavior
        tests and CLI goldens) instead of requiring browser-based visual checks.
      hold: null
      resolution: completed
      slot: done
      status: closed
