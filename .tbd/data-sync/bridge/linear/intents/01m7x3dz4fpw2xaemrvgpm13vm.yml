    external_id: c84f7267-a01b-4b19-af1d-feadaeb5ba63
    kind: update_issue
    patch:
      description: PR-text diagrams draw only on pinned-revision pages, whose untrusted CSP
        bounds what Mermaid loads while it lays a diagram out. Without a page CSP,
        KPress image placement still loads URLs from themeCSS (init directive and front
        matter), a fontFamily directive, state classDef, block-beta style, and the image
        shape (measured in headless Chrome). Lay PR-text diagrams out in a same-origin
        srcdoc frame whose meta CSP is default-src 'none', img-src data:, script-src the
        frame entry and Mermaid's directory, so nothing loads under either profile, and
        draw them on every page.
