  - bead_id: is-01kxry31k2e62styhj8t59jj12
    external_id: b2c972be-cc9e-4692-b3ca-d041777ec425
    kind: update_issue
    patch:
      description: "Provide a no-shell async subprocess boundary for non-Git provider tools,
        beginning with gh api: fixed argv, bounded stdin/stdout/stderr, sanitized
        environment, timeouts, concurrent drain, cancellation/reap, typed failures, and
        secret-safe diagnostics. Add a short-lived trusted GhCredentialSession broker
        that selects an explicit gh login, obtains its token once with gh auth token,
        retains credential state only in broker memory, injects it only into child gh
        api environments, and disposes it on exit. The broker also implements
        issue_git_fetch_credential_lease: it registers short-lived
        GitFetchCredentialLease entries in the Phase 2B core registry, bound to provider
        kind, instance, stable principal, authorization-context key, visibility
        partition, expiry, cancellation generation, and exact provider-declared
        credential-free HTTPS sources, keeps them live until every Git run using them
        finishes, then revokes them (immediately on crash or cancellation). It exposes a
        session-owned credential answer hook that answers only runs core armed for one
        run, lease, and source URL through mb-s123's askpass bridge and never sends
        token bytes to plugins or the parent application. The parent receives only
        bounded response frames, opaque lease registrations, and typed failures. Support
        bounded JSON stdin and separate parsing of included response metadata from body.
        Test broker loss, lease revocation on exit, external account switch, child
        cancellation and reaping, and absence of tokens from argv, ordinary environment,
        files, logs, records, and diagnostics. Reuse Git runner invariants without
        routing gh through the Git-specific API."
      hold: null
      parentId: 06ad4ed9-e57c-43ff-a0bd-72bc542de8f5
      resolution: completed
      slot: done
      status: closed
      title: "Platform: bounded subprocess runner for provider adapters"
