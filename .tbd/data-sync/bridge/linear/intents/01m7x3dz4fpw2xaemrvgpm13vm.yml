        tinyglobby@0.2.17 -> fdir@6.5.0/picomatch@4.0.7. picomatch 4.0.7 is the newest
        published release, so there is no patched version to take, and npm audit's only
        offered fix is downgrading tryscript to 0.2.1 (breaking). main's last CI
        (4eb299fd, 16:40Z) predates the advisory. Needs a decision per
        SUPPLY-CHAIN-SECURITY.md: a recorded, package-scoped audit exception for this
        advisory (picomatch is used only by the dev-time golden runner over
        repository-controlled globs), or wait for an upstream fix."
