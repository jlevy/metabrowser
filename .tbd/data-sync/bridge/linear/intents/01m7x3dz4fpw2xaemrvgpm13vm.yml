  - bead_id: is-01m0jsvvcqw7knvxbaq4sn6ddj
    external_id: 21c3ee1a-cf78-4125-9ff3-6e9a4ff80b80
    kind: update_issue
    patch:
      description: >-
        Every model the browser draws should be reachable from `metab` without a browser
        or a listening port, and every one that is reachable should be pinned by a
        golden transcript. Today two of eleven data surfaces meet that bar.


        The principle is drawn on the layering this codebase already has — route, kind,
        model, view. Three of those four layers are data and need no screen; only the
        view does. So parity is stated at the model layer, and the view layer is exempt
        with an enumerated list of what that covers and where it is tested instead.


        The gap that matters most is /api/file: it carries the kind and the view list
        for every selection, so the tabs a reader sees are decided there, and nothing
        outside a browser proves that README.md opens as markdown with Document and
        Source.


        A second finding shapes the design. `--walk` and `--diff` reach their models
        through the library, not the route, so they prove the model and not the wire. A
        route can accept a parameter the library never sees, or drop an envelope key,
        with every existing golden still green — which is what happened when the nav
        filter shipped.


        The work is a `--api <route>` mode through the real ASGI stack, a `--show
        <path>` mode reporting the four layers for one selection, one normalizer stating
        which fields are stable, a parity column in the map document, and a check in
        `make lint` that fails when a registered route, kind, or view has no CLI
        equivalent or no golden.


        Spec:
        docs/project/specs/active/plan-2026-08-21-cli-parity-and-golden-coverage.md
      hold: null
      resolution: completed
      slot: done
      status: closed
