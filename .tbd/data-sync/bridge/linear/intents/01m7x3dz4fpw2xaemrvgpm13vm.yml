    kind: update_issue
    patch:
      description: "On #499 at de96415af, CI run 44033895259 attempt 2, job test (3.12) (id
        133878838296): 4 workers, 6606 items; at 07:08:31 '[gw3] node down: Not properly
        terminated', 'replacing crashed worker gw3', progress continued to 99% at
        07:08:53, then nothing until the run was cancelled at 07:38. Cleanup found the
        controller, three workers, and an orphaned git (pid 16320). No stack dump: under
        xdist pytest-timeout's thread method os._exits the worker and its dump goes to
        the worker's discarded output, so the crash was most likely a 60 s timeout in
        some test, but its name was lost with the final summary. dbcfd3214 adds
        faulthandler_timeout = 55, which dumps every stack to the job log from a worker
        too, so the next occurrence names the test. Also a hung job has no
        timeout-minutes in Phase 1 and runs to GitHub's 360-minute default; Phase 2
        (mb-oz36) adds the limits. Reproduce by rerunning #499's CI; read the
        faulthandler dump; fix the cause (a test, a git that waits forever, or xdist's
        handling of a crashed worker). Locally, a worker killed with a child left
        behind, and a test that times out, do not hang xdist 3.8.0."
