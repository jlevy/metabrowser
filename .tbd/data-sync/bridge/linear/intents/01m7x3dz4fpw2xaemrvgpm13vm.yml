    kind: update_issue
    patch:
      description: "Continue removing the scoped BasedPyright exceptions without weakening the
        global strict floor. pyproject.toml's [tool.basedpyright] keeps typeCheckingMode
        = \"strict\" and scopes the debt to two executionEnvironments: src
        (reportPrivateUsage, reportUnknownArgumentType, reportUnknownMemberType,
        reportUnknownVariableType and reportUnusedFunction off) and tests (the pytest
        fixture and monkeypatch boundaries). devtools has none. Acceptance: turn a rule
        back on for an environment once its diagnostics reach zero, and never add a
        broad global suppression. Measure what remains by running basedpyright with the
        rule enabled rather than recording a count here."
