  - bead_id: is-01m75fzpspek15x7d5dqhnc2yw
    external_id: dd29b58a-44ef-4ab6-8b84-3da53df41085
    kind: update_issue
    patch:
      description: >-
        Follow-up from stack #350 (PR #348 reviews C1/F1-F3, #347 review D2), merged
        2026-11-11. The revision page's full-file Markdown render
        (builtin_plugins/github/pull_snapshot.py) runs in a thread under a
        whole-document work estimate (_DOCUMENT_WORK_MS = 400). An estimate is not a
        deadline. Review G on #348 found that Pygments has no text-size bound: a 1.6 KB
        console line took 12 s in the shell session prompt pattern, and 15 of 594 lexers
        are quadratic in a line's length (48 KB of devicetree took 79 s), some of it
        inside one re match that holds the GIL. So neither a thread nor
        asyncio.to_thread with a timeout can stop such a render or keep the event loop
        running. Meanwhile the page renders fenced code unhighlighted
        (render_kpress_view(plain_code=True)), and the estimate charges code as text.


        Route the document render through a killable child process with a deadline, as
        metabrowser.diff.markdown_projection_worker already does for Markdown redlines.
        Keep the estimate as the first check, restore highlighting in the child, and
        measure first-render latency against the thread path.
