  - bead_id: is-01m7v6edc1nqgwd7ef1r7tt0zb
    external_id: c1e6908b-4758-492e-abde-167466de3b27
    kind: update_issue
    patch:
      description: "Each commit and each pull request shows its size as Git pushes it: the
        bytes of a thin pack of head ^base (base = first parent for a commit, merge base
        for a pull request), with git's delta search pinned so the number is a function
        of the two commit IDs. A tooltip gives the uncompressed diff size (bytes of git
        diff --binary). Commit IDs are immutable, so a measured size is never
        recomputed: kept in memory, and for a repository store in a bank beside the
        store. Research measurements: thin pack 5-70 ms per change on this repository;
        sum of new objects and objectsize:disk are misleading."
