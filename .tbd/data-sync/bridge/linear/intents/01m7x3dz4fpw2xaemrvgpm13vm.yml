        version detection, stdin isolation, non-interactive environment, and bounded
        acquisition/background policies. Acquire into an isolated worktree-free staging
        repository; record source, closed non-secret FetchAuthorizationContext kind,
        fetch-policy version, exact refspec, expected OID, object format, and base
        generation; validate before importing objects and CAS-publishing only
        Metabrowser-owned refs. Unknown SSH or credential-helper principals receive
        fresh unshareable contexts. Publish the validated immutable store first and the
        source alias as the sole visibility commit, with source-alias locking and crash
        reclamation for orphaned stores. Define deterministic provider-identity store
        derivation without a mutable provider-to-store pointer, but keep GitHub
