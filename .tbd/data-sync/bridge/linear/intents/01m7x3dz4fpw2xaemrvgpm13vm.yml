    external_id: 5ac93656-9f01-4f86-8202-814d487b1bcb
    kind: update_issue
    patch:
      description: >-
        Epic for Mermaid support:
        docs/project/specs/active/plan-2026-08-21-mermaid-diagram-rendering.md.
        Research: docs/project/research/research-2026-08-21-mermaid-diagram-support.md.


        The pinned KPress (0.3.5) emits <figure data-kpress-diagram="mermaid"
        data-kpress-diagram-status="source"> for a mermaid fence, ships js/diagrams.js,
        and lists it as an asset entry point that static/plugin-sdk.js already loads. It
        no-ops because globalThis.mermaid is never defined. Missing inputs: a vendored
        Mermaid library and a per-mount initKpressDiagrams call. The on-demand loading
        tier it relies on is on main (static/asset-loader.js, on_demand_script_bundles
        in server.py).


        Recommendation: vendor the Mermaid 11.17.0 ESM build, load it lazily from the
        Markdown plugin mount path only when the container holds a diagram figure, keep
        securityLevel strict. Measured in Chromium 141: eager UMD costs 3,572,296 bytes
        and 449 ms on every document; lazy ESM costs 754 KB and 101 ms only on documents
        that have a diagram, then ~34 ms per additional diagram of the same type.
