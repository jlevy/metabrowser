    patch:
      description: "Since about 2026-11-17 17:00 UTC the lint job's 'make audit' step fails on
        every open PR (seen on jlevy/metabrowser#515, #517, #519, #520): npm audit
        reports 4 high-severity findings for picomatch (GHSA-fc5q-39xc-vjpf, ReDoS
