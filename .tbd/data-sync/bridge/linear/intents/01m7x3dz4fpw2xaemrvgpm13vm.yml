    patch:
      description: >-
        Provider-based search surface, in phases
        (plan-2026-07-17-scalable-file-search.md). Phase 1, a T or / Quick Search
        palette that fuzzy-matches a client file catalog without a search request, and
        Phase 2, a client-complete catalog over non-gitignored filenames (/api/catalog
        plus catalog.change, decision mb-ci04), shipped in v0.3.0. Repository PR
        completions joined it with #309 and #314.


