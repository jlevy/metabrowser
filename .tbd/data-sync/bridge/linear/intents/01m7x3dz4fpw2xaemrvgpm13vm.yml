    patch:
      description: "Owner, 2026-11-20: 'on a cloud mirror repo like the one I just opened for
        metabrowser I don't see any grouping by age. Is this because it's a fresh clone?
        Is there any way for us to have the ages of the files represent the actual files
        from the git commits?' and 'closer to what a normal Git repo would be'. Today a
        Git revision offers no By age, by design (docs/design-system.md Grouping the
        Files Tree: 'A Git revision has no modification times'). Give each blob at a
        revision the commit time of the last commit at or before the revision that
        changed it (as GitHub's file list does), cached per revision and computed
        incrementally from a parent revision's answer, bounded by measured budgets on
        large histories, with an honest state for files not yet dated."
