    kind: create_issue
    patch:
      description: >-
        Effort epic for archive support (ZIP and every ZIP-based format by its bytes;
        tar, and tar compressed with gzip, bzip2, or xz), planned in
        docs/project/specs/active/plan-2026-11-24-archive-contents-and-browsing.md.


        Phase 1: an archive kind whose Contents view lists the members as a tree on the
        archive's own file page, with a summary and problem counts.

        Phase 2: archives expand in the navigation tree like folders, and members open
        with their own kinds' views, through two new generic plugin surfaces (member
        sources, and folder-like container children).


        Safety requirements carried from TODO.md: safe member paths, symlink and
        traversal rejection, duplicate-name behavior, nesting limits, and aggregate
        decompression limits, all before members are readable.
