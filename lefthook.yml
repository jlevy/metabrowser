# Git hooks managed by lefthook (https://lefthook.dev).
# Install once with `make hooks-install`.

pre-commit:
  parallel: false
  commands:
    ruff-format:
      glob: "*.py"
      run: uv --config-file uv.toml run --frozen ruff format {staged_files}
      stage_fixed: true

    ruff-check:
      glob: "*.py"
      run: uv --config-file uv.toml run --frozen ruff check --fix {staged_files}
      stage_fixed: true

    biome:
      glob: "*.{js,css,json}"
      run: make biome-fix STAGED_FILES="{staged_files}"
      stage_fixed: true

    browser-types:
      glob: "*.{js,ts}"
      run: make browser-types

    codespell:
      glob: "*.{py,md}"
      run: uv --config-file uv.toml run --frozen codespell --write-changes {staged_files}
      stage_fixed: true

    format-markdown:
      glob: "*.md"
      run: make format-markdown
      stage_fixed: true

pre-push:
  commands:
    quality:
      # Git exports repository-local variables to hooks. Clear them before the
      # test suite creates fixture repositories, or `git init <fixture>` can
      # reinitialize the real shared Git directory instead.
      run: unset $(git rev-parse --local-env-vars) && make lint-check test
