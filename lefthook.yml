# Git hooks managed by lefthook (https://lefthook.dev).
# Install once with `make hooks-install`.

pre-commit:
  parallel: false
  commands:
    ruff-format:
      glob: "*.py"
      run: uv --config-file uv.toml run --frozen ruff format {staged_files}
      stage_fixed: true

    ruff-check:
      glob: "*.py"
      run: uv --config-file uv.toml run --frozen ruff check --fix {staged_files}
      stage_fixed: true

    biome:
      glob: "*.{js,css,json}"
      run: make biome-fix STAGED_FILES="{staged_files}"
      stage_fixed: true

    browser-types:
      glob: "*.{js,ts}"
      run: make browser-types

    codespell:
      glob: "*.{py,md}"
      run: uv --config-file uv.toml run --frozen codespell --write-changes {staged_files}
      stage_fixed: true

    format-markdown:
      glob: "*.md"
      run: make format-markdown
      stage_fixed: true

pre-push:
  commands:
    quality:
      # From a linked worktree, git exports GIT_DIR to this hook. It outranks the
      # working directory for every git the gate spawns, so a fixture's `git init`
      # rewrote the shared repository configuration with core.bare = true. The gate
      # finds its repository from the working directory, so clear the whole
      # metabrowser.git.process._REPO_PINNING_GIT_VARS list;
      # tests/test_git_hook_environment.py keeps this line and that list in step.
      run: >-
        unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY
        GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_PREFIX GIT_NAMESPACE GIT_CEILING_DIRECTORIES &&
        make lint-check test
