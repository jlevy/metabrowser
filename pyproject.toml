# ---- Project Info and Dependencies ----

[project.urls]
Homepage = "https://github.com/jlevy/metabrowser"
Repository = "https://github.com/jlevy/metabrowser"
Documentation = "https://github.com/jlevy/metabrowser#readme"
Issues = "https://github.com/jlevy/metabrowser/issues"

[project]
name = "metabrowser"
description = "Browse local files from your web browser, with extensible plugin-based rendering of Markdown, code, JSON, YAML, logs, and other files."
authors = [
    { name="Joshua Levy", email="joshua@cal.berkeley.edu" },
]
maintainers = [
    { name="Joshua Levy", email="joshua@cal.berkeley.edu" },
]
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<4.0"
dynamic = ["version"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: User Interfaces",
]
keywords = ["browser", "jsonl", "logs", "markdown", "developer-tools"]


# ---- Main dependencies ----

dependencies = [
    "cachetools>=7.1.4",
    "frontmatter-format>=0.5.1",
    "funlog>=0.2.1",
    "json5>=0.15.0",
    "jsonschema>=4.26.0",
    "kpress==0.3.10",
    "markdown-it-py==4.2.0",
    "pathspec>=1.1.1",
    "prettyfmt>=0.4.1",
    "pydantic>=2.13.4",
    "pygments>=2.20.0",
    "pypdfium2>=5.15.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ruamel.yaml>=0.19.1",
    "softschema==0.9.1",
    "starlette>=1.3.1",
    "strif>=3.1.0",
    "typer>=0.26.8",
    "uvicorn>=0.49.0",
    "watchfiles>=1.2.0",
]

[project.optional-dependencies]
yaml-accelerator = ["ruamel.yaml.clib==0.2.15; platform_python_implementation == 'CPython'"]


# ---- Dev dependencies ----

[dependency-groups]
build = [
    "hatchling==1.30.1",
    "uv-dynamic-versioning==0.14.0",
]
dev = [
    "basedpyright>=1.39.9",
    "codespell>=2.4.2",
    "httpx2>=2.12.0",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-sugar>=1.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "rich>=15.0.0",
    "ruff>=0.15.20",
]

[project.scripts]
metab = "metabrowser.cli.entrypoint:main"
metabrowser = "metabrowser.cli.entrypoint:main"


# ---- Build system ----

# Dynamic versioning from:
# https://github.com/ninoseki/uv-dynamic-versioning/

[build-system]
requires = ["hatchling==1.30.1", "uv-dynamic-versioning==0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"
# Note JSON schemas don't seem to be right for tool.hatch.version.source so
# this may cause false warnings in IDEs.
# https://github.com/ninoseki/uv-dynamic-versioning/issues/21

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
# A build past the last tag reports the next minor release as a development build
# (0.12.0 + commits -> 0.13.0.devN), not the next patch, so it meets the macOS app's
# minimum metab, which is a minor release (docs/publishing.md#choosing-a-version).
bump = { enable = true, index = 1 }
# The commit in a development version, as in 0.13.0.dev5+abc1234, is cut to the length
# every line shows a commit (SHORT_COMMIT_CHARS in src/metabrowser/commit_ids.py), not
# Git's abbreviation, so the version label and the line after it name it alike.
# tests/test_short_commit.py holds the two equal.
commit-length = 7

[tool.uv]
# An editable install records its version once, when uv builds it, and uv rebuilds it
# only when a cache key changes. With these keys, a sync after a new commit or tag
# (make install, or any uv run) rebuilds it, so a checkout reports the version its
# commit and the tags give, which the macOS app holds to its minimum. Measured
# 2026-11-18 in a worktree at a load average of 100 to 170: a sync with nothing changed
# took 0.05 to 0.09 s, and the rebuild it does once after each commit or tag 2.4 to
# 3.6 s; a tag added or deleted in a worktree, where .git is a file, rebuilt it.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build]
exclude = [
    "/.agents/",
    "/.claude/",
    "/.codex/",
    "/.github/",
    "/.tbd/",
    "/.copier-answers.yml",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/skills-lock.json",
    "/.venv/",
    "/attic/",
    "/dist/",
    "/node_modules/",
    # The native macOS app (Swift) builds separately and never ships in the Python package.
    "/apps/",
]

[tool.hatch.build.targets.wheel]
# The source location for the package.
packages = ["src/metabrowser"]


[tool.ruff]
# Set as desired, typically 88 (black standard) or 100 (wide).
line-length = 100

[tool.ruff.lint]
select = [
    # Correctness-oriented floor shared with KPress. Formatting and narrow
    # preferences remain the formatter's responsibility.
    "E",
    "F",
    "B",
    "UP",
    "I",
    "C4",
    "SIM",
    "RUF",
    "ASYNC",
    "TID",
    "LOG",
    "G",
    # A bidirectional control or zero-width space in source reads as something it is
    # not; write such characters as escapes.
    "PLE2502",
    "PLE2515",
]
ignore = [
    # Disable some rules that are overly pedantic. Add/remove as desired:
    "E501", # https://docs.astral.sh/ruff/rules/line-too-long/
    "E402", # https://docs.astral.sh/ruff/rules/module-import-not-at-top-of-file/
    "E731", # https://docs.astral.sh/ruff/rules/lambda-assignment/
    "B008",
    # Maintained prose intentionally uses typographic characters.
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF022",
    "RUF043",
    # These APIs intentionally expose timeouts and perform bounded metadata calls
    # while coordinating asyncio-native filesystem work.
    "ASYNC109",
    "ASYNC240",
    # We use both ruff formatter and linter so some rules should always be disabled.
    # See: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191", # https://docs.astral.sh/ruff/rules/tab-indentation/
    "E111", # https://docs.astral.sh/ruff/rules/indentation-with-invalid-multiple/
    "E114", # https://docs.astral.sh/ruff/rules/indentation-with-invalid-multiple-comment/
    "E117", # https://docs.astral.sh/ruff/rules/over-indented/
    "D206", # https://docs.astral.sh/ruff/rules/docstring-tab-indentation/
    "D300", # https://docs.astral.sh/ruff/rules/triple-single-quotes/
    "Q000", # https://docs.astral.sh/ruff/rules/bad-quotes-inline-string/
    "Q001", # https://docs.astral.sh/ruff/rules/bad-quotes-multiline-string/
    "Q002", # https://docs.astral.sh/ruff/rules/bad-quotes-docstring/
    "Q003", # https://docs.astral.sh/ruff/rules/avoidable-escaped-quote/
    "COM812", # https://docs.astral.sh/ruff/rules/missing-trailing-comma/
    "COM819", # https://docs.astral.sh/ruff/rules/prohibited-trailing-comma/
    "ISC002", # https://docs.astral.sh/ruff/rules/multi-line-implicit-string-concatenation/
]

[tool.basedpyright]
# BasedPyright currently seems like the best type checker option, much faster
# than mypy and with a good extension for VSCode/Cursor.
# https://marketplace.visualstudio.com/items?itemName=detachhead.basedpyright
# https://docs.basedpyright.com/latest/configuration/config-files/#sample-pyprojecttoml-file
include = ["src", "tests", "devtools"]
# This disposable integration is checked separately against the exact reviewed
# fdu wheel. The normal MetaBrowser environment deliberately has no fdu
# dependency, so analyzing it here would turn an absent optional artifact into
# unknown-type noise rather than verify either package.
exclude = ["explorations/fdu-inventory-adapter"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
reportImplicitOverride = false
executionEnvironments = [
    # The source tree still has legacy cross-module private helpers and dynamic
    # JSON/plugin boundaries. Keep those diagnostics local to source code so
    # devtools remain at the KPress strict floor.
    { root = "src", reportPrivateUsage = false, reportUnknownArgumentType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnusedFunction = false },
    # Pytest fixtures and monkeypatched boundaries are dynamically typed. This
    # environment contains that debt without weakening source or devtools.
    { root = "tests", extraPaths = ["."], reportPrivateUsage = false, reportUnknownArgumentType = false, reportUnknownLambdaType = false, reportUnknownMemberType = false, reportUnknownParameterType = false, reportUnknownVariableType = false, reportMissingParameterType = false },
]

[tool.ruff.lint.isort]
known-first-party = ["metabrowser"]

[tool.codespell]
# "rouge" is GitLab's syntax highlighter (a proper noun), not a typo of rogue.
ignore-words-list = "browseable,fo,rouge,ue,unparseable"
# Vendored third-party browser bundles are minified upstream artifacts;
# their identifiers are not prose to spell-check. attic/ holds read-only
# third-party checkouts kept for research (gitignored, never shipped); this
# guard covers a direct codespell run, since devtools/lint.py already asks
# git for the doc set and git honors .gitignore.
skip = "*/static/vendor/*,./attic/*"

[tool.pytest.ini_options]
python_files = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = [
    "src",
    "tests",
]
pythonpath = ["."]
norecursedirs = []
filterwarnings = []
# One test's whole budget, in seconds. The thread method ends the run when it fires,
# not one test, so a bound inside a test (a child process's timeout, a polling
# deadline) has to be shorter than the budget to fail that test instead: at most 50
# under this default. A test that needs longer carries pytest.mark.timeout with the
# measurement that forced it.
timeout = 60
timeout_method = "thread"
# Under pytest-xdist this ends a worker, not the run, and its stack dump is lost with
# the worker's output; tests/suite_workers.py dumps every stack to the log first.

# pytest keeps every test's tmp_path, and tests/conftest.py removes what is not needed
# (tests/transient_output.py has why, what stays, and the measurements): it empties a
# test's tmp_path unless the test failed or errored in setup, call or teardown, and
# removes a passing session's whole base directory. pytest's "failed" policy would remove
# a test's directory by its call's outcome alone, so one whose setup errored or whose
# teardown failed would lose it.
tmp_path_retention_policy = "all"
