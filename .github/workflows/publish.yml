name: Publish to PyPI

on:
  release:
    types: [published]

env:
  UV_EXCLUDE_NEWER: "14 days"

jobs:
  build-and-publish:
    # Every published release runs this workflow, and the macOS app's releases are
    # tagged macos-v<VERSION> (apps/macos/README.md), so only a v tag, the Python
    # package's, runs this job. "Verify release tag and package version" still refuses a
    # v tag that is not v<MAJOR>.<MINOR>.<PATCH>.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # setup-uv fetches a manifest once, with a fixed 5 s limit, even for a pinned version,
      # and a slow answer failed the job; it fetches nothing when the pinned uv is already in
      # the tool cache, where this step puts it with retries (devtools/install_uv.sh).
      - name: Install uv
        run: bash devtools/install_uv.sh 0.11.26 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: false
          python-version: "3.13"

      # setup-node downloads a Node the runner image lacks and copies it into the tool cache
      # file by file, and each has stalled for over a minute; it does neither when the
      # pinned Node is already in the tool cache, where this step unpacks a checksum-pinned
      # download fetched with retries (devtools/install_node.sh).
      - name: Install Node
        run: bash devtools/install_node.sh 24.18.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"

      - name: Set up Python
        run: uv python install

      - name: Run the complete release gate
        run: make verify

      # uv honors `[tool.uv.sources]` only in this checkout; the published metadata keeps
      # the bare requirement, which a branch-built dependency's release may not satisfy.
      - name: Refuse a dependency resolved from a source other than its index
        run: |
          uv --config-file uv.toml run --frozen python - <<'PY'
          import sys, tomllib
          sources = tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("uv", {}).get("sources", {})
          if sources:
              sys.exit(f"Refusing to publish with [tool.uv.sources] set: {sorted(sources)}")
          PY

      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Refusing to publish non-release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          expected="${RELEASE_TAG#v}"
          actual="$(uv --config-file uv.toml run --frozen python -c 'import metabrowser; print(metabrowser.__version__)')"
          if [ "$actual" != "$expected" ]; then
            printf 'Release version mismatch: expected %s from tag %s, got %s\n' \
              "$expected" "$RELEASE_TAG" "$actual" >&2
            exit 1
          fi

      - name: Verify documented version pins match the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Public-hygiene checks keep these operator documents versionless.
          # This release-time check additionally rejects stale pins if one is
          # introduced; it does not permit pins that public hygiene forbids.
          # The skill uses metabrowser@latest with the operator's uv cool-off.
          version="${RELEASE_TAG#v}"
          status=0
          for doc in skills/metabrowser/SKILL.md README.md docs/installation.md; do
            stale="$(grep -nE 'metabrowser[@=]=?[0-9]+\.[0-9]+\.[0-9]+' "$doc" \
              | grep -vE "metabrowser[@=]=?$version" || true)"
            if [ -n "$stale" ]; then
              printf '%s pins a version other than %s:\n%s\n' "$doc" "$version" "$stale" >&2
              status=1
            fi
          done
          exit "$status"

      - name: Publish to PyPI
        run: uv --config-file uv.toml publish --trusted-publishing always

      - name: Smoke-test the published release from PyPI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          # The just-published release is newer than the 14-day cool-off, so
          # exempt this one first-party package (dependencies keep the
          # cool-off). Refreshing the package on every attempt prevents uv from
          # caching the initial negative lookup while PyPI propagates the release.
          bound="$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in $(seq 1 10); do
            if uv --config-file uv.toml tool run \
                --refresh-package metabrowser \
                --exclude-newer-package "metabrowser=$bound" \
                "metabrowser@$version" --help \
              && uv --config-file uv.toml tool run \
                --refresh-package metabrowser \
                --exclude-newer-package "metabrowser=$bound" \
                "metabrowser@$version" --doctor; then
              exit 0
            fi
            printf 'Pinned invocation not ready (attempt %s); retrying...\n' "$attempt" >&2
            sleep 30
          done
          printf 'Pinned metabrowser@%s failed --help/--doctor after publish\n' "$version" >&2
          exit 1
