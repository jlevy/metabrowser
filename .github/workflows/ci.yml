name: CI

# The suite as parallel jobs with one verdict, ci-ok. The design, and why each check
# runs where it does, is docs/project/specs/active/plan-2026-11-16-fast-ci.md, and the
# testing guide (docs/e2e-testing.md, "CI Jobs") says how to add a shard. A job's
# timeout-minutes is about 1.5 times its measured 90th percentile, with the measurement
# beside it: one that trips means a tier grew by half, and the remedy is another shard or
# a cheaper slow test. `make ci-report` takes the times again. devtools/check_ci.py, in
# `make lint-check`, holds this file to the jobs, targets, interpreters, shards,
# triggers, and permissions its docstring lists, and tests/test_check_ci.py breaks each.

on:
  push:
    branches: ["main"]
  # Every pull request, not only those targeting main. A stacked pull request
  # has a base of the branch below it, so a branches filter here silently gives
  # the stack no CI at all -- which is exactly when review needs it most.
  #
  # Never pull_request_target, which would run with the base repository's token. Under
  # pull_request the workflow and its devtools/ci_*.sh scripts come from the pull
  # request's own merge commit, so a change to the gate is reviewed as one.
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its running jobs. A push to main is a group
# of its own, its commit, so every commit on main keeps its verdict and none is cancelled.
# A cancelled run still runs its ci-ok, which is always(), and the newer run starts once
# that has: about a minute on run 44038762653, behind a full queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_EXCLUDE_NEWER: "14 days"
  # A cache restore's deadline in minutes, in setup-node, setup-uv, and
  # actions/cache/restore alike (@actions/cache's getDownloadOptions): each 128 MiB segment
  # of the download must arrive within it, or the restore gives up and the job goes on as
  # on a miss. It is a wall-clock limit, not a stall detector. Every cache here is one
  # segment (in run 45545935794 npm's was 111 MB, the admitted Git build's 49 MB, and uv's
  # 9 MB), so a restore still moving becomes a miss below about 1.85 MB/s for npm. The
  # default, 10 minutes, outlasts every job's limit here: one npm restore stalled at 87 %
  # for 7.5 minutes until its job's limit ended it (run 44387846150, mb-z4i7). The slowest
  # restores that finished took 25 s (npm, in 81 setup-node logs of runs 43916652624 to
  # 45539408952) and 20 s (the admitted Git build, over runs 43910077901 to 45542298244).
  # A miss costs the next step's fetch of what the cache held. The Git build is the one
  # measured: 66 to 109 s in those runs' nine builds, which the admitted-git limit holds.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

jobs:
  plan:
    # Reads whether main is red, and decides which path the run takes, the short one of
    # a pull request or main's whole matrix: each tier's interpreters and parts, whether
    # the Chrome tier runs, the admitted Gits, and whether
    # stack-integration has anything to check (devtools/ci_plan.sh). It always runs and
    # writes the event, the base, main's state, both trees, and its decisions to its
    # summary, so a skipped chrome or stack-integration still says why.
    runs-on: ubuntu-latest
    # 0.1 minutes on runs 44037230262, 44038762653, and 44041984874; a limit is whole
    # minutes.
    timeout-minutes: 2
    # The one job that reads other runs: main's newest ci.yml push runs. Recorded in
    # SUPPLY-CHAIN-SECURITY.md.
    permissions:
      contents: read
      actions: read
    outputs:
      path: ${{ steps.decide.outputs.path }}
      pythons: ${{ steps.decide.outputs.pythons }}
      chrome: ${{ steps.decide.outputs.chrome }}
      unit-shards: ${{ steps.decide.outputs.unit-shards }}
      goldens-shards: ${{ steps.decide.outputs.goldens-shards }}
      chrome-shards: ${{ steps.decide.outputs.chrome-shards }}
      admitted-git-shards: ${{ steps.decide.outputs.admitted-git-shards }}
      admitted-gits: ${{ steps.decide.outputs.admitted-gits }}
      integration: ${{ steps.decide.outputs.integration }}
      main-sha: ${{ steps.decide.outputs.main-sha }}
      main-state: ${{ steps.decide.outputs.main-state }}
      main-run: ${{ steps.decide.outputs.main-run }}
      main-run-sha: ${{ steps.decide.outputs.main-run-sha }}
      tests-red: ${{ steps.decide.outputs.tests-red }}
    steps:
      # Full history: tests-red asks whether this commit contains main's red head, and
      # git merge-tree merges main into a stacked head. check_ci.py holds it.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what this run checks
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # Every interpreter main runs each tier on, and the one a pull request runs
          # them on while main is green. check_ci.py holds both to pyproject.toml's
          # classifiers and the free-threaded build, and every tier's matrix to this
          # job's outputs.
          PYTHONS: '["3.12", "3.13", "3.14", "3.14t"]'
          PR_CHROME_PYTHON: "3.13"
          # The Git releases admitted-git builds on main: ACQUISITION_MINIMUM,
          # ACQUISITION_NEWEST_PATCHED, and a release at or above FILE_AGES_GIT_MINIMUM
          # (metabrowser/git/file_ages.py); and the one a pull request builds while main
          # is green, the minimum, which is the security floor. Checksums are pinned in
          # devtools/build_admitted_git.sh; check_supply_chain.py requires both floors
          # here, and the pull request's to be the minimum.
          ADMITTED_GITS: '["2.43.7", "2.50.1", "2.56.1"]'
          PR_ADMITTED_GIT: "2.43.7"
        run: bash devtools/ci_plan.sh

  lint:
    runs-on: ubuntu-latest
    # 90th percentile 1.7 minutes, longest 2.4, over 317 jobs
    # (docs/project/research/research-2026-11-16-ci-speed.md).
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-uv fetches a manifest once, with a fixed 5 s limit, even for a pinned version,
      # and a slow answer failed the job; it fetches nothing when the pinned uv is already in
      # the tool cache, where this step puts it with retries (devtools/install_uv.sh).
      - name: Install uv
        run: bash devtools/install_uv.sh 0.11.26 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: "3.13"

      # setup-node downloads a Node the runner image lacks and copies it into the tool cache
      # file by file, and each has stalled for over a minute; it does neither when the
      # pinned Node is already in the tool cache, where this step unpacks a checksum-pinned
      # download fetched with retries (devtools/install_node.sh).
      - name: Install Node
        run: bash devtools/install_node.sh 24.18.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Run quality gates and audits
        run: make lint-check audit

  distribution:
    runs-on: ubuntu-latest
    # 90th percentile 0.8 minutes over 322 jobs (the research brief above).
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-uv fetches a manifest once, with a fixed 5 s limit, even for a pinned version,
      # and a slow answer failed the job; it fetches nothing when the pinned uv is already in
      # the tool cache, where this step puts it with retries (devtools/install_uv.sh).
      - name: Install uv
        run: bash devtools/install_uv.sh 0.11.26 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: "3.13"

      # setup-node downloads a Node the runner image lacks and copies it into the tool cache
      # file by file, and each has stalled for over a minute; it does neither when the
      # pinned Node is already in the tool cache, where this step unpacks a checksum-pinned
      # download fetched with retries (devtools/install_node.sh).
      - name: Install Node
        run: bash devtools/install_node.sh 24.18.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Validate source and wheel distributions
        run: make build

  unit:
    # The parallel tier, in parts of whole files: two on each interpreter on the main
    # path, and four on one interpreter for a pull request while main is green (the
    # plan job's pythons and unit-shards; devtools/ci_plan.sh says why those counts).
    # Whole, under xdist, it ran past the time at which the fast CI plan splits a job
    # (Time Limits), and xdist sped it up less than the factor below which the plan
    # splits it from the start (Testing Strategy). Phase 1 Measurements in the plan has
    # the times and the factor.
    needs: plan
    name: unit (${{ matrix.python-version }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.pythons) }}
        shard: ${{ fromJSON(needs.plan.outputs.unit-shards) }}
    runs-on: ubuntu-latest
    # 3.2 to 5.0 minutes over the eight jobs of run 45066732637 (193 to 299 seconds, the
    # longest on 3.14t), with the parts dealt by the measured time of 55 of the 465
    # files; dealt by all of them the two parts hold the same seconds of tests
    # (devtools/shard_weights.json). Before the parts were dealt by time the second set
    # it: 90th percentile 4.2 minutes over 23 jobs in runs 44037230262 to 44046843606.
    # The main path sets the limit: a pull request's parts took 2.5 to 3.2 minutes in
    # three (run 45069289704).
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-uv fetches a manifest once, with a fixed 5 s limit, even for a pinned version,
      # and a slow answer failed the job; it fetches nothing when the pinned uv is already in
      # the tool cache, where this step puts it with retries (devtools/install_uv.sh).
      - name: Install uv
        run: bash devtools/install_uv.sh 0.11.26 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # setup-node downloads a Node the runner image lacks and copies it into the tool cache
      # file by file, and each has stalled for over a minute; it does neither when the
      # pinned Node is already in the tool cache, where this step unpacks a checksum-pinned
      # download fetched with retries (devtools/install_node.sh).
      - name: Install Node
        run: bash devtools/install_node.sh 24.18.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Run the parallel tier
        run: make test-parallel SHARD=${{ matrix.shard }}

  goldens:
    # The goldens, then the serial tier, in three parts on each of the plan job's
    # interpreters (pythons and goldens-shards). The serial tier rides here so that it
    # has the machine to itself and adds no job, and it is dealt into the same number of
    # parts (by test), so each part runs its third of the goldens and then its third of
    # the serial tier, which keeps the serial tests alone on the machine and keeps the
    # parts the same length.
    needs: plan
    name: goldens and serial (${{ matrix.python-version }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.pythons) }}
        shard: ${{ fromJSON(needs.plan.outputs.goldens-shards) }}
    runs-on: ubuntu-latest
    # Three parts since 2026-11-22. In two, dealt evenly by measured time, the eight
    # jobs of run 45066732637 took 2.8 to 3.9 minutes (165 to 234 seconds, the slowest
    # on 3.12 and 3.14t), which is at the 4.0 the nightly check allows of this limit:
    # the goldens had grown since the 2.7 to 3.3 of run 44795249295. A part now holds
    # about a third of the goldens and of the serial tests, by measured time.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-uv fetches a manifest once, with a fixed 5 s limit, even for a pinned version,
      # and a slow answer failed the job; it fetches nothing when the pinned uv is already in
      # the tool cache, where this step puts it with retries (devtools/install_uv.sh).
      - name: Install uv
        run: bash devtools/install_uv.sh 0.11.26 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # setup-node downloads a Node the runner image lacks and copies it into the tool cache
      # file by file, and each has stalled for over a minute; it does neither when the
      # pinned Node is already in the tool cache, where this step unpacks a checksum-pinned
      # download fetched with retries (devtools/install_node.sh).
      - name: Install Node
        run: bash devtools/install_node.sh 24.18.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Run the goldens
        run: make test-goldens SHARD=${{ matrix.shard }}

      # After the goldens, so the serial tier has the machine to itself; it runs when a
      # golden failed too, so the job reports both.
      - name: Run the serial tier
        if: ${{ !cancelled() }}
        run: make test-serial SHARD=${{ matrix.shard }}

  chrome:
    # The Chrome tier, always all of it (make test-chrome). A push to main, and a pull
    # request while main is red, run it on every interpreter. A pull request while main
    # is green runs it on PR_CHROME_PYTHON in more, shorter parts, and not at all when
    # its change touches no browser path; the plan job decides (chrome, pythons, and
    # chrome-shards) and its summary says from which paths, and ci-ok accepts the skip
    # only when it decided none.
    needs: plan
    if: needs.plan.outputs.chrome != 'none'
    name: chrome (${{ matrix.python-version }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.pythons) }}
        shard: ${{ fromJSON(needs.plan.outputs.chrome-shards) }}
    runs-on: ubuntu-latest
    # 4.0 to 4.4 minutes over the sixteen jobs of run 45066732637 (238 to 263 seconds),
    # every part alike, since the parts are dealt by measured time
    # (devtools/shard_weights.json). Dealt by rank in node-ID order, the first part took
    # 6.0 to 6.6 minutes on run 45062416967 and the others 2.7 to 4.7. The main path
    # sets the limit: a pull request deals the same tests into more parts
    # (CHROME_SHARDS_PR in devtools/ci_plan.sh, with the measurement). By 2026-11-27
    # four parts took up to 6.8 minutes (409 s on run 45976882655, 426 s on a pull
    # request run on main's path, 45978583219), so main deals the tier into five
    # (CHROME_SHARDS_MAIN, with the measurement).
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-uv fetches a manifest once, with a fixed 5 s limit, even for a pinned version,
      # and a slow answer failed the job; it fetches nothing when the pinned uv is already in
      # the tool cache, where this step puts it with retries (devtools/install_uv.sh).
      - name: Install uv
        run: bash devtools/install_uv.sh 0.11.26 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # setup-node downloads a Node the runner image lacks and copies it into the tool cache
      # file by file, and each has stalled for over a minute; it does neither when the
      # pinned Node is already in the tool cache, where this step unpacks a checksum-pinned
      # download fetched with retries (devtools/install_node.sh).
      - name: Install Node
        run: bash devtools/install_node.sh 24.18.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Run the Chrome tier
        run: make test-chrome SHARD=${{ matrix.shard }}

  admitted-git:
    # Production refuses repository acquisition below the Git security floor
    # (tests/fixtures/repository-cache/git-version-gates.json). The unit jobs patch
    # the floor so that they pass on any Git, so nothing there proves acquisition
    # against the floor itself. Which Git those jobs get follows the runner image:
    # Ubuntu's own package is below the floor, and the image has shipped a newer one
    # the floor admits (2.55.0 on 2026-10-01).
    #
    # This job builds the lowest admitted release, the newest patched one, and the release
    # that tests file ages on a Git revision (git last-modified, which the first two lack;
    # tests/file_ages_git.py) from checksum-verified kernel.org source, puts that Git first on PATH for this job
    # only, and runs the acquisition, store-read, and full-clone acceptance tests
    # with nothing patched. METABROWSER_REQUIRE_ADMITTED_GIT turns their below-floor
    # skip into a failure and fails when a different Git answers, so the job cannot
    # pass by testing nothing. Pins and review: SUPPLY-CHAIN-SECURITY.md.
    #
    # A push to main, and a pull request while main is red, build all three (the plan
    # job's ADMITTED_GITS). A pull request while main is green builds the lowest alone,
    # which is the floor, and runs its tests in two parts of whole files (admitted-gits
    # and admitted-git-shards).
    needs: plan
    name: admitted-git (${{ matrix.git }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        git: ${{ fromJSON(needs.plan.outputs.admitted-gits) }}
        shard: ${{ fromJSON(needs.plan.outputs.admitted-git-shards) }}
    runs-on: ubuntu-latest
    # 2.7 to 4.1 minutes under xdist over the six jobs of run 44026747033's first three
    # attempts and 2.7 to 3.9 over runs 44037230262 and 44038762653, with the build
    # cached; building Git took 0.8 to 1.4 more on a cache miss (run 43576279668). The
    # main path sets the limit: a pull request's two parts of the lowest release took
    # 2.4 and 2.7 minutes (run 45069289704).
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Locate the admitted Git build
        id: admitted-git
        run: |
          echo "prefix=$HOME/.cache/admitted-git/${{ matrix.git }}" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      # The build links the runner's shared libraries, so the key names the runner
      # image. The build script holds the pinned checksum and recipe, so a changed
      # pin or recipe rebuilds.
      - name: Restore the admitted Git build
        id: restore-git
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.admitted-git.outputs.prefix }}
          key: admitted-git-${{ runner.os }}-${{ steps.admitted-git.outputs.image }}-${{ matrix.git }}-${{ hashFiles('devtools/build_admitted_git.sh') }}

      - name: Build Git from checksum-verified source
        if: steps.restore-git.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libcurl4-openssl-dev zlib1g-dev
          bash devtools/build_admitted_git.sh "${{ matrix.git }}" "${{ steps.admitted-git.outputs.prefix }}"

      # Saved right after the build rather than at job end, so a failing test does
      # not throw the build away.
      - name: Save the admitted Git build
        if: steps.restore-git.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.admitted-git.outputs.prefix }}
          key: ${{ steps.restore-git.outputs.cache-primary-key }}

      - name: Put the admitted Git first on PATH
        run: echo "${{ steps.admitted-git.outputs.prefix }}/bin" >> "$GITHUB_PATH"

      - name: Confirm which Git answers
        run: |
          command -v git
          git --version
          test "$(git --version)" = "git version ${{ matrix.git }}"

      # setup-uv fetches a manifest once, with a fixed 5 s limit, even for a pinned version,
      # and a slow answer failed the job; it fetches nothing when the pinned uv is already in
      # the tool cache, where this step puts it with retries (devtools/install_uv.sh).
      - name: Install uv
        run: bash devtools/install_uv.sh 0.11.26 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: "3.13"

      # setup-node downloads a Node the runner image lacks and copies it into the tool cache
      # file by file, and each has stalled for over a minute; it does neither when the
      # pinned Node is already in the tool cache, where this step unpacks a checksum-pinned
      # download fetched with retries (devtools/install_node.sh).
      - name: Install Node
        run: bash devtools/install_node.sh 24.18.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Run acquisition and full-clone acceptance on the admitted Git
        env:
          METABROWSER_REQUIRE_ADMITTED_GIT: ${{ matrix.git }}
        run: make test-admitted-git SHARD=${{ matrix.shard }}

  stack-integration:
    # A pull request in an informal chain, its base another branch and no GitHub stack,
    # is tested against the branch below it, never against main. That is the wrong
    # question at merge time: when the branch below lands, this one's base becomes
    # main, and the result of that merge has never been built. A whole stack can read
    # green and still not be mergeable -- observed concretely, as a CHANGELOG conflict
    # that every pull request in the stack was individually clean of.
    #
    # These jobs ask the question the dashboard does not: take the pull request's
    # head, merge main into it, and run the gate on the result. For the top of a
    # stack that is the whole stack against main, because the top contains every
    # branch below it.
    #
    # A formal GitHub stack's merge commit already holds main: GitHub merges the head
    # into its base merged with main (run 44038762653 of #504). The plan job then
    # reports `contained`, and nothing more runs. Otherwise these run only when merging
    # main changes the tree the other jobs check, since an identical tree is identical
    # input to every check. The plan job's summary is the record of a skipped run, and a
    # conflict fails ci-ok. A pull request whose base is main gets exactly this from
    # `pull_request`, which builds the merge commit.
    needs: plan
    if: needs.plan.outputs.integration == 'needed'
    name: stack-integration (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        # The gate as the jobs above split it, on Python 3.13; make -k reports the
        # serial tier when a golden fails, as the goldens job does.
        part:
          - lint-check
          - test-parallel SHARD=1/2
          - test-parallel SHARD=2/2
          - -k test-goldens test-serial
          - test-chrome SHARD=1/4
          - test-chrome SHARD=2/4
          - test-chrome SHARD=3/4
          - test-chrome SHARD=4/4
    runs-on: ubuntu-latest
    # The goldens and serial part sets it: 90th percentile 6.0 minutes and longest 6.3
    # over its 19 passing jobs in the 20 runs 45119143049 to 45136984133, where every
    # other part's 90th percentile was 2.3 to 4.5 and its longest 5.5. The goldens had
    # grown since the 1.2 to 4.3 minutes of runs 44037230262, 44041984874, and
    # 44045094850, which set 7, and at 7 one slow wheel download (`uv sync` preparing 67
    # packages in 2 m 45 s, not its usual 2 s) ended the part (run 45134271894, mb-lo7l).
    timeout-minutes: 9
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The main commit the plan job compared, so that every part checks one tree.
      - name: Merge main into the pull request head
        env:
          MAIN_SHA: ${{ needs.plan.outputs.main-sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "$MAIN_SHA"

      # setup-uv fetches a manifest once, with a fixed 5 s limit, even for a pinned version,
      # and a slow answer failed the job; it fetches nothing when the pinned uv is already in
      # the tool cache, where this step puts it with retries (devtools/install_uv.sh).
      - name: Install uv
        run: bash devtools/install_uv.sh 0.11.26 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: "3.13"

      # setup-node downloads a Node the runner image lacks and copies it into the tool cache
      # file by file, and each has stalled for over a minute; it does neither when the
      # pinned Node is already in the tool cache, where this step unpacks a checksum-pinned
      # download fetched with retries (devtools/install_node.sh).
      - name: Install Node
        run: bash devtools/install_node.sh 24.18.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Run the gate on the merged result
        run: make ${{ matrix.part }}

  ci-ok:
    # The one verdict a ruleset requires: it fails unless every job above succeeded,
    # and while main is red it writes the line AGENTS.md (Git) merges by
    # (devtools/ci_verdict.sh). always() runs it when a job it needs failed or was
    # skipped, so that a missing job reads as a failure, not as a skipped check.
    if: always()
    needs: [plan, lint, distribution, unit, goldens, chrome, admitted-git, stack-integration]
    runs-on: ubuntu-latest
    # 0.1 minutes on runs 44037230262 and 44038762653.
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Decide the run's verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
          INTEGRATION: ${{ needs.plan.outputs.integration }}
          CHROME: ${{ needs.plan.outputs.chrome }}
          MAIN_STATE: ${{ needs.plan.outputs.main-state }}
          MAIN_RUN: ${{ needs.plan.outputs.main-run }}
          MAIN_RUN_SHA: ${{ needs.plan.outputs.main-run-sha }}
          TESTS_RED: ${{ needs.plan.outputs.tests-red }}
        run: bash devtools/ci_verdict.sh
