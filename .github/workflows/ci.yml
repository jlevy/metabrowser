name: CI

on:
  push:
    branches: ["main"]
  # Every pull request, not only those targeting main. A stacked pull request
  # has a base of the branch below it, so a branches filter here silently gives
  # the stack no CI at all -- which is exactly when review needs it most.
  pull_request:

permissions:
  contents: read

env:
  UV_EXCLUDE_NEWER: "14 days"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Run quality gates and audits
        run: make lint-check audit

  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Run tests
        run: make test

  admitted-git:
    # Production refuses repository acquisition below the Git security floor
    # (tests/fixtures/repository-cache/git-version-gates.json), and the runner's
    # distribution Git reports a version below it. The `test` job therefore patches
    # the floor, and nothing there acquires on a Git production would admit.
    #
    # This job builds the lowest admitted release and the newest patched one from
    # checksum-verified kernel.org source, puts that Git first on PATH for this job
    # only, and runs the acquisition, store-read, and no-lazy-fetch acceptance tests
    # with nothing patched. METABROWSER_REQUIRE_ADMITTED_GIT turns their below-floor
    # skip into a failure and fails when a different Git answers, so the job cannot
    # pass by testing nothing. Pins and review: SUPPLY-CHAIN-SECURITY.md.
    name: admitted-git (${{ matrix.git }})
    strategy:
      fail-fast: false
      matrix:
        # ACQUISITION_MINIMUM and ACQUISITION_NEWEST_PATCHED. Checksums are pinned in
        # devtools/build_admitted_git.sh; check_supply_chain.py requires both floors here.
        git: ["2.43.7", "2.50.1"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Locate the admitted Git build
        id: admitted-git
        run: |
          echo "prefix=$HOME/.cache/admitted-git/${{ matrix.git }}" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      # The build links the runner's shared libraries, so the key names the runner
      # image. The build script holds the pinned checksum and recipe, so a changed
      # pin or recipe rebuilds.
      - name: Restore the admitted Git build
        id: restore-git
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.admitted-git.outputs.prefix }}
          key: admitted-git-${{ runner.os }}-${{ steps.admitted-git.outputs.image }}-${{ matrix.git }}-${{ hashFiles('devtools/build_admitted_git.sh') }}

      - name: Build Git from checksum-verified source
        if: steps.restore-git.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libcurl4-openssl-dev zlib1g-dev
          bash devtools/build_admitted_git.sh "${{ matrix.git }}" "${{ steps.admitted-git.outputs.prefix }}"

      # Saved right after the build rather than at job end, so a failing test does
      # not throw the build away.
      - name: Save the admitted Git build
        if: steps.restore-git.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.admitted-git.outputs.prefix }}
          key: ${{ steps.restore-git.outputs.cache-primary-key }}

      - name: Put the admitted Git first on PATH
        run: echo "${{ steps.admitted-git.outputs.prefix }}/bin" >> "$GITHUB_PATH"

      - name: Confirm which Git answers
        run: |
          command -v git
          git --version
          test "$(git --version)" = "git version ${{ matrix.git }}"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Run acquisition and no-lazy-fetch acceptance on the admitted Git
        env:
          METABROWSER_REQUIRE_ADMITTED_GIT: ${{ matrix.git }}
        run: make test-admitted-git

  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Validate source and wheel distributions
        run: make build

  stack-integration:
    # A stacked pull request is tested against the branch below it, never against
    # main. That is the wrong question at merge time: when the branch below lands,
    # this one's base becomes main, and the result of that merge has never been
    # built. A whole stack can read green and still not be mergeable -- observed
    # concretely, as a CHANGELOG conflict that every pull request in the stack was
    # individually clean of.
    #
    # This job asks the question the dashboard does not: take the pull request's
    # head, merge main into it, and run the gate on the result. For the top of a
    # stack that is the whole stack against main, because the top contains every
    # branch below it.
    #
    # Only for stacked pull requests. One whose base is already main gets exactly
    # this from `pull_request`, which builds the merge commit.
    # The gate is on the steps rather than the job, so the job always reports the
    # context it decided from. A job-level `if` that evaluates false leaves nothing
    # behind to explain itself, which is exactly the failure this whole change is
    # about: a check that silently does not run looks the same as one that passed.
    runs-on: ubuntu-latest
    env:
      STACKED: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main' }}
    steps:
      - name: Report what this job decided from
        run: |
          echo "event_name       = ${{ github.event_name }}"
          echo "base_ref         = ${{ github.base_ref }}"
          echo "pull_request.base= ${{ github.event.pull_request.base.ref }}"
          echo "stacked          = ${{ env.STACKED }}"
          if [ "${{ env.STACKED }}" != "true" ]; then
            echo "Base is main (or this is not a pull request); the pull_request event"
            echo "already builds the merge commit, so there is nothing extra to check."
          fi

      - if: env.STACKED == 'true'
        name: Checkout the pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - if: env.STACKED == 'true'
        name: Merge main into the pull request head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          if ! git merge --no-edit FETCH_HEAD; then
            echo "::error::This branch conflicts with main, so the stack cannot merge as it stands."
            git --no-pager diff --diff-filter=U --name-only
            exit 1
          fi

      - if: env.STACKED == 'true'
        name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: true
          python-version: "3.13"

      - if: env.STACKED == 'true'
        name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"

      - if: env.STACKED == 'true'
        name: Set up Python
        run: uv python install

      - if: env.STACKED == 'true'
        name: Run the gate on the merged result
        run: make lint-check test
