name: Exact Mac title menu verification

on:
  push:
    branches: [codex/title-menu-verify]
    paths: [.github/workflows/title-menu-exact-verify.yml]

permissions:
  contents: read

env:
  UV_EXCLUDE_NEWER: "14 days"
  CANDIDATE_SHA: "2e0238ae9bff4860643278b5c00932373f14e2f1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact title-menu candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout revision
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          printf 'Verifying candidate %s\n' "$CANDIDATE_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: false
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"

      - name: Set up Python
        run: uv python install

      - name: Check runner tools
        run: |
          git --version
          jq --version
          node --version
          npm --version
          google-chrome --version

      - name: Run the complete release gate
        run: make verify PYTEST_WORKERS=4 GOLDEN_JOBS=4
