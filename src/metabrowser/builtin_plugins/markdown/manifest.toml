[plugin]
name = "markdown"
display_name = "Markdown"
version = "0.0.1"
sdk_version = "0.2"
extra_styles = ["markdown.css"]

# Generic Markdown handling. Higher-priority plugin classifiers may claim
# specialized document kinds; this plugin handles every other Markdown file.
[[kind]]
id = "markdown"
match = { ext = ".md" }
priority = 0

# View definitions; renderers live in index.js as
# registerView("markdown", "rendered", ...) / ("markdown", "source", ...).
# container_class drives the outer <div class="..."> the shell creates;
# md-body picks up prose styling for rendered markdown.
[[view]]
kind = "markdown"
id = "rendered"
label = "Document"
default = true
container_class = "content-body metabrowser-kpress-host md-body"
printable = true
print_profile = "document"
render_runtime = "kpress"

[[view]]
kind = "markdown"
id = "source"
label = "Source"
container_class = "content-body metabrowser-source-host"
printable = true
print_profile = "source"
render_runtime = "client"
