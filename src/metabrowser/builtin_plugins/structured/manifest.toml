[plugin]
name = "structured"
display_name = "Structured Data"
version = "0.0.1"
sdk_version = "0.4"
extra_scripts = ["preview.js", "tree.js"]

# Generic JSON / YAML browser. Renders the parsed structure as a
# virtualized, YAML-styled tree (default) with the original raw text
# also available via the source view. Schema-aware variants
# (e.g. analysis-report, report-bundle) can claim specific files
# at higher priority and fall back to mb.builtins.structured.renderInlineTree
# for their raw view.
[[kind]]
id = "structured"
match = { exts = [".json", ".yaml", ".yml"] }
priority = 0

[[view]]
kind = "structured"
id = "tree"
label = "Tree"
default = true

[[view]]
kind = "structured"
id = "source"
label = "Source"
printable = true
print_profile = "source"
render_runtime = "client"

[[data_hook]]
route = "parsed"
sidekick = "metabrowser.builtin_plugins.structured:parsed_handler"
methods = ["GET"]
