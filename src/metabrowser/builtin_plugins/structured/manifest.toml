[plugin]
name = "structured"
display_name = "Structured Data"
version = "0.0.1"
sdk_version = "0.8"
python_requires = ["cachetools", "frontmatter-format", "json5", "pyyaml", "ruamel.yaml", "starlette"]
# The table plugin's routes serve this plugin's [[table_source]], and its view draws the
# Table view (mb.plugins.load("table") in index.js).
requires = ["table"]

# Generic JSON / YAML browser. Table offers the ordered projection or the
# shared record grid. Tree and Source keep their existing entry points.
# Schema-aware variants
# (e.g. analysis-report, report-bundle) can claim specific files
# at higher priority and fall back to the renderInlineTree its exports
# offer (`requires = ["structured"]`) for their raw view.
[[kind]]
id = "structured"
match = { exts = [".json", ".yaml", ".yml"] }
priority = 0

[[view]]
kind = "structured"
id = "table"
label = "Table"
key = "a"
default = true
container_class = "content-body table-view-host"
printable = true
print_profile = "table"
render_runtime = "client"

[[view]]
kind = "structured"
id = "tree"
label = "Tree"
key = "v"

[[view]]
kind = "structured"
id = "source"
label = "Source"
key = "s"
printable = true
print_profile = "source"
render_runtime = "client"

[[data_hook]]
route = "parsed"
sidekick = "metabrowser.builtin_plugins.structured:parsed_handler"
methods = ["GET"]

[[table_source]]
kind = "structured"
adapter = "metabrowser.builtin_plugins.structured.records:adapter"
