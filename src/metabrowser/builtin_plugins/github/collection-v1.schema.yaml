$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
description: |-
  Ordered annotated items over one comparison.

  A collection has no prose of its own: the document that holds it introduces it, as a
  pull request's description introduces its guide.
properties:
  comparison:
    $ref: '#/$defs/CollectionComparison'
  items:
    items:
      $ref: '#/$defs/CollectionItem'
    maxItems: 40
    minItems: 1
    title: Items
    type: array
required:
- comparison
- items
title: Collection
type: object
