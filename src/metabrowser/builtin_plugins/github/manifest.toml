[plugin]
name = "github"
display_name = "GitHub"
version = "0.0.1"
sdk_version = "0.7"

# GitHub support: the URL reducer, the gh credential helper, and pull-request records
# reach core through metabrowser.cache.providers, not this manifest. The manifest mounts
# the pull-request routes and the pull-request page's view, which is all the shell loads
# index.js for.

# The served pull request's cached record, with a typed absent, pending, current, or
# stale state. Answers from the cache alone; only a refresh fetches.
[[data_hook]]
route = "pull"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_handler"
methods = ["GET"]

# A comparison from the selected PR's store, reusing its persisted manifest.
[[data_hook]]
route = "pull-comparison"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_comparison_handler"
methods = ["GET"]

# Start or join the served pull request's refresh in the refresh coordinator. A POST
# with a JSON object body, behind the same-origin guard; it returns at once.
[[data_hook]]
route = "pull-refresh"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_refresh_handler"
methods = ["POST"]

# One text of the served pull request's cached record -- its description or one
# comment or review -- rendered as Markdown through KPress in its sanitized mode.
[[data_hook]]
route = "pull-markdown"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_markdown_handler"
methods = ["GET"]

# One list of the repository's pull requests (all, open, or closed), a window of its
# cached rows, with a typed absent, pending, current, or stale state. Answers from the
# cache alone; only a refresh fetches, and it runs no Git.
[[data_hook]]
route = "pulls"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pulls_handler"
methods = ["GET"]

# Start or join that list's refresh in the refresh coordinator, or extend it by one GitHub
# page. A POST with a JSON object body, behind the same-origin guard; it returns at once.
[[data_hook]]
route = "pulls-refresh"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pulls_refresh_handler"
methods = ["POST"]

# The served pull request's page at /pull/<n>[/files]. No file is ever this kind: the
# shell selects it for the pull-request route and mounts this view there.
[[view]]
kind = "pull-request"
id = "pull-request"
label = "Pull request"
default = true
container_class = "content-body github-pull-host"
render_runtime = "client"
