[plugin]
name = "github"
display_name = "GitHub"
version = "0.0.1"
sdk_version = "0.8"
python_requires = ["markdown-it-py", "pydantic", "softschema", "starlette"]
# A text's Mermaid diagrams are drawn by the Markdown plugin's diagram host, and Guided Review's
# excerpts by the diff plugin's file renderer (`mountFilePatch`).
requires = ["markdown", "diff"]

# GitHub support: the URL reducer, the gh credential helper, and pull-request records
# reach core through metabrowser.cache.providers, not this manifest. The manifest mounts
# the pull-request routes and the two views the shell loads index.js for.

# One pull request's cached record, by number, with a typed absent, pending, current,
# or stale state. Answers from the cache alone; only a refresh fetches.
[[data_hook]]
route = "pull"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_handler"
methods = ["GET"]

# Start or join one pull request's refresh in the refresh coordinator. A POST with a
# JSON object body naming its number, behind the same-origin guard; it returns at once.
[[data_hook]]
route = "pull-refresh"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_refresh_handler"
methods = ["POST"]

# Background lightweight metadata batches; selected full refresh remains a separate action.
[[data_hook]]
route = "pull-cores-prepare"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_cores_prepare_handler"
methods = ["POST"]

# A pinned comparison from an acquired checkout store. GET never starts acquisition.
[[data_hook]]
route = "pull-comparison"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_comparison_handler"
methods = ["GET"]

# An image at an admitted comparison's head, which its rendered Markdown shows.
[[data_hook]]
route = "pull-image"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_image_handler"
methods = ["GET"]

# One changed Markdown file of an admitted comparison as a bounded rendered redline.
[[data_hook]]
route = "pull-rendered-diff"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_rendered_diff_handler"
methods = ["GET"]

# The size an admitted comparison pushes, and its patch's, for the page's size line.
[[data_hook]]
route = "pull-size"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_size_handler"
methods = ["GET"]

# A selected PR's bounded Conversation projection, held separately from discussion.
[[data_hook]]
route = "pull-timeline"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_timeline_handler"
methods = ["POST"]

# One text of a pull request's cached record -- its description or one comment or
# review -- rendered as Markdown through KPress in its sanitized mode.
[[data_hook]]
route = "pull-markdown"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_markdown_handler"
methods = ["GET"]

# A cached PR description's Guided Review artifact and one step of its pinned comparison.
[[data_hook]]
route = "guided-review"
sidekick = "metabrowser.builtin_plugins.github.sidekick:guided_review_handler"
methods = ["GET"]

# A filtered window of the repository's shared PR catalog (open, closed, or all), with
# exact remote totals, cached coverage, and typed freshness. GET is cache-only and runs
# no Git; catalog background work is started separately.
[[data_hook]]
route = "pulls"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pulls_handler"
methods = ["GET"]

# Start or join resumable catalog warming, prioritizing the requested display target
# before backfilling all metadata. Same-origin POST returns before background work.
[[data_hook]]
route = "pulls-refresh"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pulls_refresh_handler"
methods = ["POST"]

# Optional native stack membership. Reads never discover tooling or contact GitHub.
[[data_hook]]
route = "stacks"
sidekick = "metabrowser.builtin_plugins.github.sidekick:stacks_handler"
methods = ["GET"]

[[data_hook]]
route = "stacks-refresh"
sidekick = "metabrowser.builtin_plugins.github.sidekick:stacks_refresh_handler"
methods = ["POST"]

# A native stack's combined change, its bottom's base against its top's head, summed for
# the brief change line its Pulls heading shows. Reads never contact GitHub or fetch; the
# store lists a comparison not yet summed.
[[data_hook]]
route = "stack-change"
sidekick = "metabrowser.builtin_plugins.github.sidekick:stack_change_handler"
methods = ["GET"]

# A native stack's page at /stack/<n>: its members, the comparison from its bottom's merge
# base to its top's head restricted to the files its layers change, the members the top
# lacks, and each file's layers. Reads never contact GitHub or fetch.
[[data_hook]]
route = "stack"
sidekick = "metabrowser.builtin_plugins.github.sidekick:stack_handler"
methods = ["GET"]

# That comparison as a diff document, immutable at the address the stack route names.
[[data_hook]]
route = "stack-comparison"
sidekick = "metabrowser.builtin_plugins.github.sidekick:stack_comparison_handler"
methods = ["GET"]

# The repository's whole label set, cached, which colors a label a record names alone.
# Reads never contact GitHub. Only labels-refresh asks for it, which a pull request's page
# sends when it shows a label named alone that its envelope has no entry for.
[[data_hook]]
route = "labels"
sidekick = "metabrowser.builtin_plugins.github.sidekick:labels_handler"
methods = ["GET"]

[[data_hook]]
route = "labels-refresh"
sidekick = "metabrowser.builtin_plugins.github.sidekick:labels_refresh_handler"
methods = ["POST"]

# One pull request's changed files, from the local comparison or GitHub's list, with a
# typed absent, pending, current, or stale state and an honest count while it fills.
# Answers from the cache alone; only a refresh lists them.
[[data_hook]]
route = "pull-files"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_files_handler"
methods = ["GET"]

# What each named pull request's cached changed-files list sums to, by status and in lines,
# for the brief change line its Pulls row shows. From the cache alone: no gh and no Git.
[[data_hook]]
route = "pull-files-summary"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_files_summary_handler"
methods = ["GET"]

# Each named pull request's operational status and its verdict, for the readiness its Pulls
# row shows: what the Pulls tab's scan, which pulls-refresh starts, or the page's own read
# last kept. From the cache alone: no gh and no Git.
[[data_hook]]
route = "pull-statuses"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_statuses_handler"
methods = ["GET"]

# Start or join that list's refresh in the refresh coordinator. A POST with a JSON object
# body naming its number, behind the same-origin guard; it returns at once.
[[data_hook]]
route = "pull-files-refresh"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pull_files_refresh_handler"
methods = ["POST"]

# Background prefetch: a visible page names what the reader is likely to open next, and
# one lane per repository refreshes it behind every reader's request, within caps and the
# rate-limit governor. GET reports the lane from memory; POST replaces its queue.
[[data_hook]]
route = "pulls-prefetch"
sidekick = "metabrowser.builtin_plugins.github.sidekick:pulls_prefetch_handler"
methods = ["GET", "POST"]

# Discard everything this plugin caches for the served repository, to be fetched again.
# A same-origin POST with an empty JSON object; the source and its Git store stay.
[[data_hook]]
route = "cache-clear"
sidekick = "metabrowser.builtin_plugins.github.sidekick:cache_clear_handler"
methods = ["POST"]

# The GitHub status check: gh's path and version, the signed-in account, its scopes, and
# one state with the step that fixes it, as metab --doctor reports it. It runs gh, so it
# is a POST; {"fresh": true} runs it again rather than reuse a recent answer.
[[data_hook]]
route = "status"
sidekick = "metabrowser.builtin_plugins.github.sidekick:status_handler"
methods = ["POST"]

# A pull request's page at /pull/<n>[/files]. No file is ever this kind: the
# shell selects it for the pull-request route and mounts this view there.
[[view]]
kind = "pull-request"
id = "pull-request"
label = "Pull request"
default = true
container_class = "content-body github-pull-host"
render_runtime = "client"

# A native stack's page at /stack/<n>[/files|/docs|/changes[/<path>]]. No file is ever this
# kind: the shell selects it for the stack route and mounts this view there.
[[view]]
kind = "pull-stack"
id = "pull-stack"
label = "Stack"
default = true
container_class = "content-body github-pull-host"
render_runtime = "client"

# The repository's pull requests, in the Pulls tab and at /pulls. No file is ever this kind:
# the shell mounts it for that tab and that route, in a host of its own, so it names no
# container class.
[[view]]
kind = "pull-request-list"
id = "pull-request-list"
label = "Pull requests"
default = true
render_runtime = "client"
