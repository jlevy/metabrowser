[plugin]
name = "binary"
display_name = "Binary"
version = "0.0.1"
sdk_version = "0.1"

# `binary` is assigned by metabrowser.server when a non-image, non-text
# file falls past the classifier. No [[kind]] match here for the same
# reason `text` doesn't have one — the fallback is in code, not the
# manifest.
#
# Binary kind has no views; the shell's no-views branch explains that
# no preview is available. The empty plugin folder + manifest documents
# that ownership lives here for any future binary-specific renderer
# (hex dump, embedded preview).
