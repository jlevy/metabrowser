[plugin]
name = "agents"
display_name = "Agents (Claude Code, Codex, Gemini, Pi logs)"
version = "0.0.1"
sdk_version = "0.7"
register = "metabrowser.builtin_plugins.agents.adapters"

# Coding-agent JSONL session logs from Claude Code, Codex, Gemini, or Pi CLI.
# Each adapter gets its own [[kind]] entry that resolves to the same kind id.
# Adapter sniffing happens in the JSONL parser (detect_adapter); the manifest
# match.adapter field reads that value. Codex has two adapters: `codex` for the
# `codex exec --json` stream and `codex-rollout` for the rollout files Codex keeps.

[[kind]]
id = "agent-log"
match = { ext = ".jsonl", adapter = "claude" }
priority = 0

[[kind]]
id = "agent-log"
match = { ext = ".jsonl", adapter = "codex" }
priority = 0

[[kind]]
id = "agent-log"
match = { ext = ".jsonl", adapter = "codex-rollout" }
priority = 0

[[kind]]
id = "agent-log"
match = { ext = ".jsonl", adapter = "gemini" }
priority = 0

[[kind]]
id = "agent-log"
match = { ext = ".jsonl", adapter = "pi" }
priority = 0

[[data_hook]]
route = "charts"
sidekick = "metabrowser.builtin_plugins.agents.sidekick:charts_handler"
methods = ["GET"]

[[view]]
kind = "agent-log"
id = "log"
label = "Log"
key = "v"
default = true

[[view]]
kind = "agent-log"
id = "charts"
label = "Charts"
key = "c"

[[view]]
kind = "agent-log"
id = "raw"
label = "Raw JSON"
key = "s"

[[data_hook]]
route = "catalog"
sidekick = "metabrowser.builtin_plugins.agents.routes:catalog_handler"
methods = ["GET"]

[[data_hook]]
route = "sessions"
sidekick = "metabrowser.builtin_plugins.agents.routes:sessions_handler"
methods = ["GET"]

[[data_hook]]
route = "session"
sidekick = "metabrowser.builtin_plugins.agents.routes:session_handler"
methods = ["GET"]

[[data_hook]]
route = "records"
sidekick = "metabrowser.builtin_plugins.agents.routes:records_handler"
methods = ["GET"]

[[data_hook]]
route = "live"
sidekick = "metabrowser.builtin_plugins.agents.routes:live_handler"
methods = ["GET"]
