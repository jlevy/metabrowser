[plugin]
name = "agent-log"
display_name = "Agent log (Claude / Gemini / Pi)"
version = "0.0.1"
sdk_version = "0.1"

# Coding-agent JSONL session logs from Claude Code, Gemini, or Pi CLI.
# Each adapter gets its own [[kind]] entry that resolves to the same kind id.
# Adapter sniffing happens in the JSONL parser (detect_adapter); the manifest
# match.adapter field reads that value.

[[kind]]
id = "agent-log"
match = { ext = ".jsonl", adapter = "claude" }
priority = 0

[[kind]]
id = "agent-log"
match = { ext = ".jsonl", adapter = "gemini" }
priority = 0

[[kind]]
id = "agent-log"
match = { ext = ".jsonl", adapter = "pi" }
priority = 0

[[data_hook]]
route = "charts"
sidekick = "metabrowser.builtin_plugins.agent_log.sidekick:charts_handler"
methods = ["GET"]

[[view]]
kind = "agent-log"
id = "log"
label = "Log"
default = true

[[view]]
kind = "agent-log"
id = "charts"
label = "Charts"

[[view]]
kind = "agent-log"
id = "raw"
label = "Raw JSON"
