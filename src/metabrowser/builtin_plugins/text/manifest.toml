[plugin]
name = "text"
display_name = "Text"
version = "0.0.1"
sdk_version = "0.3"

# `text` is the catch-all kind — used by classify_file_kind when no
# other rule matches. There's no manifest [[kind]] match predicate
# that captures "everything else"; the kind assignment happens in
# metabrowser.file_kinds and this manifest declares the view that
# the plugin's index.js renders for it.

[[view]]
kind = "text"
id = "source"
label = "Source"
default = true
container_class = "content-body metabrowser-source-host"
printable = true
print_profile = "source"
render_runtime = "client"
