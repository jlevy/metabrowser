$defs:
  CanonicalTimestamp:
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{3})?Z$
    type: string
  ConfigUpgrade:
    additionalProperties: true
    description: One Metabrowser release that migrated the application home.
    properties:
      at:
        $ref: '#/$defs/CanonicalTimestamp'
      version:
        $ref: '#/$defs/MetabrowserVersion'
    required:
    - at
    - version
    title: ConfigUpgrade
    type: object
  LayoutFormat:
    pattern: ^f[0-9]{2,}$
    type: string
  MetabrowserVersion:
    maxLength: 128
    minLength: 1
    pattern: ^[0-9A-Za-z.+!_-]+$
    type: string
  OpenInChoice:
    enum:
    - auto
    - app
    - browser
    type: string
$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: true
description: |-
  ``config.yml``: the user-owned application configuration.

  ``format`` names the home format this configuration was last published for.
  Migration publishes it last, so a layout ahead of its config marks an interrupted
  migration rather than a user edit.
properties:
  format:
    $ref: '#/$defs/LayoutFormat'
  open_in:
    anyOf:
    - $ref: '#/$defs/OpenInChoice'
    - type: 'null'
    default: null
  present_browser:
    anyOf:
    - type: boolean
    - type: 'null'
    default: null
    title: Present Browser
  upgrades:
    items:
      $ref: '#/$defs/ConfigUpgrade'
    title: Upgrades
    type: array
  written_by:
    $ref: '#/$defs/MetabrowserVersion'
required:
- format
- upgrades
- written_by
title: ApplicationConfig
type: object
x-softschema:
  contract: metabrowser.config:ApplicationConfig/v1
  schema_sha256: 8bdb93b443fbf9c793f8795e23408e6e6705fb5a5960a0f73cd970829073d6a8
