$defs:
  CanonicalTimestamp:
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{3})?Z$
    type: string
  GitObjectId:
    pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
    type: string
  GitRefName:
    maxLength: 1024
    minLength: 6
    pattern: ^refs/[!-~]+$
    type: string
  RecordedOutcome:
    enum:
    - succeeded
    - default_branch_unknown
    - origin_unavailable
    - fetch_failed
    - validation_failed
    type: string
  StoreOperation:
    additionalProperties: false
    description: |-
      The last Git operation that finished against a store, and how, by name.

      A refresh records its typed outcome, so a later start reports what happened rather
      than a bare failure. ``default_branch_unknown`` fetched everything but found no
      branch at the origin's HEAD. An outcome that says why no fetch ran in one process,
      such as another process refreshing the store, is not recorded.
    properties:
      at:
        $ref: '#/$defs/CanonicalTimestamp'
      kind:
        enum:
        - acquire
        - refresh
        title: Kind
        type: string
      outcome:
        $ref: '#/$defs/RecordedOutcome'
    required:
    - at
    - kind
    - outcome
    title: StoreOperation
    type: object
$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
description: "A store's ``state.yml``: mutable Git observations, replaced atomically."
properties:
  default_remote_ref:
    anyOf:
    - $ref: '#/$defs/GitRefName'
    - type: 'null'
  default_revision:
    anyOf:
    - $ref: '#/$defs/GitObjectId'
    - type: 'null'
  last_fetch_at:
    anyOf:
    - $ref: '#/$defs/CanonicalTimestamp'
    - type: 'null'
  last_operation:
    $ref: '#/$defs/StoreOperation'
required:
- default_remote_ref
- default_revision
- last_fetch_at
- last_operation
title: RepositoryStoreState
type: object
x-softschema:
  contract: com.github.jlevy.metabrowser.cache:RepositoryStoreState/v1
  schema_sha256: 2670f54b9aacda75b601730c2b69ad58ab093906296d1f35536d211257c71635
