$defs:
  AbsolutePath:
    maxLength: 4096
    minLength: 1
    pattern: ^/[^\x00-\x1f\x7f]*$
    type: string
  CanonicalTimestamp:
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{3})?Z$
    type: string
  GitRemoteName:
    description: A Git remote name, as a path below refs/remotes. The pattern admits a name that climbs out of it; the model refuses '..', a trailing '/', and '//', which the compiled schema alone does not express.
    maxLength: 255
    minLength: 1
    pattern: ^[A-Za-z0-9_][A-Za-z0-9._/-]*$
    type: string
  GitVersion:
    maxLength: 128
    minLength: 1
    pattern: ^[0-9]+\.[0-9]+[!-~]*$
    type: string
  ObjectFormat:
    enum:
    - sha1
    - sha256
    type: string
  Sha256Identity:
    pattern: ^sha256:[0-9a-f]{64}$
    type: string
  StoreAcquisition:
    additionalProperties: false
    description: "How a store's Git database was first populated: a fetch of every object."
    properties:
      git_version:
        $ref: '#/$defs/GitVersion'
      object_format:
        $ref: '#/$defs/ObjectFormat'
    required:
    - git_version
    - object_format
    title: StoreAcquisition
    type: object
  StoreLender:
    additionalProperties: false
    description: |-
      The checkout an overlay store borrows objects from.

      ``objects`` is the directory ``objects/info/alternates`` names, which for a linked
      worktree is the common directory's. ``checkout`` is what is shown, the checkout's
      root when the store was created, and ``remote`` the remote of that checkout whose
      identity is the source's, whose ``refs/remotes/<remote>/`` are the tips a fetch
      negotiates from.
    properties:
      checkout:
        $ref: '#/$defs/AbsolutePath'
      objects:
        $ref: '#/$defs/AbsolutePath'
      remote:
        $ref: '#/$defs/GitRemoteName'
    required:
    - checkout
    - objects
    - remote
    title: StoreLender
    type: object
$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
description: |-
  ``store.yml``: identity and acquisition metadata of a Git database.

  A store that borrows objects from a checkout has ``lender``. Absent means a full
  store, as every store written before overlays existed is. Only ``--checkout`` naming
  a new place for a lender that has gone rewrites this record.
properties:
  acquisition:
    $ref: '#/$defs/StoreAcquisition'
  created_at:
    $ref: '#/$defs/CanonicalTimestamp'
  id:
    $ref: '#/$defs/Sha256Identity'
  lender:
    anyOf:
    - $ref: '#/$defs/StoreLender'
    - type: 'null'
    default: null
required:
- acquisition
- created_at
- id
title: RepositoryStore
type: object
x-softschema:
  contract: metabrowser.cache:RepositoryStore/v1
  schema_sha256: 7a3916e025473814c60bc21baaea3fa599441f97eae877e9e1969a9aa4f2b18f
