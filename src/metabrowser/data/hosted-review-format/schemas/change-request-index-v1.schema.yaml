      max_duration_ms:
        minimum: 1
        title: Max Duration Ms
        type: integer
      max_items:
        minimum: 1
        title: Max Items
        type: integer
      max_pages:
        minimum: 1
        title: Max Pages
        type: integer
    required:
    - max_bytes
    - max_duration_ms
    - max_items
    - max_pages
