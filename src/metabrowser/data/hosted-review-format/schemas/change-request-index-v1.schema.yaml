        type: string
    required:
    - direction
    - field
    - tie_breaker
    title: IndexSort
    type: object
  IndexSortField:
    enum:
    - created_at
    - updated_at
    title: IndexSortField
    type: string
  ProviderInstance:
    type: string
  ProviderKind:
    type: string
  ProviderObjectRef:
    additionalProperties: false
    properties:
      instance:
        $ref: '#/$defs/ProviderInstance'
      object_kind:
        minLength: 1
