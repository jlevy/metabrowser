    type: object
  ProviderInstance:
    type: string
  ProviderKind:
    type: string
  ProviderObjectRef:
    additionalProperties: false
    properties:
      instance:
        $ref: '#/$defs/ProviderInstance'
      object_kind:
        minLength: 1
