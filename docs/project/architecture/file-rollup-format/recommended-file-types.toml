[[family]]
id = "markdown"
label = "Markdown"
group = "docs"
order = 100
linguist = "Markdown"
linguist_color = "#083fa1"
hue = 276.0
lightness_rank = -0.5
deviation = """GitHub puts Markdown at 261.42, inside a seven-family run -- python 246.50, xml \
251.44, typescript 253.30, powershell 258.14, markdown, lua 264.05, php 272.03 -- and it \
read as Python's blue. Markdown is the most-viewed family in the app and Python's colour \
is the better known of the two, so Markdown is the one that moves. 276.0 clears every \
other family by 0.0355 rather than 0.0149 and is still plainly a blue rather than a \
violet. The rank puts it below the band, which is the deliberate part: at its upstream \
rank it painted 0.571 against Python's 0.599, and no hue move makes a lighter blue read \
as a darker one. #083fa1 is a dark navy, so this paints closer to the colour GitHub \
chose than the band alone allowed."""

